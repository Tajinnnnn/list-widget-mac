  function timeAgo(iso) {
    const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (seconds < 60) return "just now";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function trashEntryPreview(entry) {
    const p = entry.payload;
    if (entry.kind === "list") return `List: ${p.list.name} (${p.list.items.length} item${p.list.items.length === 1 ? "" : "s"})`;
    if (entry.kind === "note" && p.item) return p.item.text;
    if (entry.kind === "note") return p.text;
    // kind "task"
    return p.item.text + (p.subtasks.length ? ` (+${p.subtasks.length} subtask${p.subtasks.length > 1 ? "s" : ""})` : "");
  }

  // Finds the list a trash entry originally belonged to, falling back to
  // the currently active list if that original list no longer exists —
  // precise original position isn't preserved, just "put it somewhere
  // visible" rather than losing it or reconstructing a whole list.
  function trashTargetList(entry) {
    return state.lists.find(l => l.id === entry.listId) || activeList();
  }

  function restoreTrashEntry(entryId) {
    const entry = state.trash.find(e => e._id === entryId);
    if (!entry) return;
    const p = entry.payload;

    if (entry.kind === "list") {
      state.lists.push(p.list);
    } else if (entry.kind === "task") {
      const target = trashTargetList(entry);
      target.items.push(p.item, ...p.subtasks);
    } else if (entry.kind === "note" && p.item) {
      const target = trashTargetList(entry);
      target.items.push(p.item);
    } else if (entry.kind === "note") {
      // An attached note: reattach to its original task if it still
      // exists anywhere; otherwise fall back to a standalone note item.
      let task = null;
      state.lists.forEach(l => { if (!task) task = l.items.find(it => it._id === p.taskId); });
      if (task) {
        task.note = task.note ? task.note + "\n" + p.text : p.text;
      } else {
        trashTargetList(entry).items.push({ _id: uid(), type: "note", text: p.text });
      }
    }

    state.trash = state.trash.filter(e => e._id !== entryId);
    save();
    renderTabs();
    renderList();
  }

  function deleteTrashEntryForever(entryId) {
    state.trash = state.trash.filter(e => e._id !== entryId);
    save();
    renderList();
  }

  function renderTrashView() {
    list.innerHTML = "";
    document.getElementById("count").textContent = state.trash.length ? `${state.trash.length} in trash` : "";

    if (!state.trash.length) {
      list.innerHTML = '<div class="empty">Trash is empty.</div>';
      return;
    }

    const emptyRow = document.createElement("div");
    emptyRow.className = "trash-empty-row";
    const emptyBtn = document.createElement("button");
    emptyBtn.className = "trash-empty-btn";
    emptyBtn.textContent = "Empty trash";
    emptyBtn.title = "Permanently delete everything in trash";
    emptyBtn.onclick = () => {
      const n = state.trash.length;
      if (!confirm(`Permanently delete all ${n} item${n > 1 ? "s" : ""} in trash? This can't be undone.`)) return;
      state.trash = [];
      save(); renderList();
    };
    emptyRow.appendChild(emptyBtn);
    list.appendChild(emptyRow);

    const order = state.trash.slice().sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));

    order.forEach(entry => {
      const li = document.createElement("li");
      li.className = "trash-row";

      const txtWrap = document.createElement("div");
      txtWrap.className = "txt-wrap";

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = trashEntryPreview(entry);
      txtWrap.appendChild(txt);

      const meta = document.createElement("div");
      meta.className = "trash-meta";
      meta.textContent = (entry.listName ? `${entry.listName} · ` : "") + timeAgo(entry.deletedAt);
      txtWrap.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const restoreBtn = document.createElement("button");
      restoreBtn.className = "restore-btn";
      restoreBtn.textContent = "↩";
      restoreBtn.title = "Restore";
      restoreBtn.onclick = () => restoreTrashEntry(entry._id);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete forever";
      del.onclick = () => {
        if (!confirm("Delete this forever? This can't be undone.")) return;
        deleteTrashEntryForever(entry._id);
      };

      actions.append(restoreBtn, del);
      li.append(txtWrap, actions);
      list.appendChild(li);
    });
  }

  function applyVibrancy(enabled) {
    document.body.classList.toggle("vibrancy", !!enabled);
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.set_vibrancy(!!enabled);
    }
  }

  // ---- Calendar view (day / agenda / month, picked in Settings) ----

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  // Due, not-yet-done tasks across every list, each paired with its list
  // (for color + name) — the calendar looks across all lists, not just
  // the active one, since due dates matter regardless of which list.
  function collectDueTasks() {
    const result = [];
    state.lists.forEach(l => {
      l.items.forEach(it => {
        if (it.due && !it.done) result.push({ item: it, list: l });
      });
    });
    result.sort((a, b) => new Date(a.item.due) - new Date(b.item.due));
    return result;
  }

  function completeDueTask(entry) {
    playCheckSound();
    entry.item.done = true;
    entry.item.completedAt = new Date().toISOString();
    if (entry.item.repeat && entry.item.due) {
      entry.item.due = nextOccurrence(entry.item.due, entry.item);
      entry.item.done = false;
      entry.item.completedAt = null;
    }
    save();
    renderList();
  }

  function buildCalChip(entry, opts) {
    opts = opts || {};
    const { item, list } = entry;
    const overdue = isOverdue(item);
    const chip = document.createElement("div");
    chip.className = "cal-chip" + (overdue ? " overdue" : "");
    if (list.color) chip.style.setProperty("--tab-color", list.color);

    const box = document.createElement("div");
    box.className = "box";
    box.title = "Mark as done";
    box.onclick = ev => { ev.stopPropagation(); completeDueTask(entry); };

    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = item.text;

    chip.append(box, txt);

    if (opts.showList && state.lists.length > 1) {
      const listname = document.createElement("div");
      listname.className = "listname";
      listname.textContent = list.name;
      chip.appendChild(listname);
    }

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = (overdue ? "Overdue · " : "") + (opts.timeText || formatDue(item.due, item.dueAllDay));
    chip.appendChild(time);

    return chip;
  }

  function renderCalendarView() {
    document.getElementById("count").textContent = "";
    const style = state.settings.calendarView;
    if (style === "agenda") renderCalendarAgenda();
    else if (style === "month") renderCalendarMonth();
    else renderCalendarDay();
  }

  function renderCalendarDay() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const today = new Date();
    const isToday = sameDay(calendarDate, today);

    const nav = document.createElement("div");
    nav.className = "daynav";
    const prev = document.createElement("button");
    prev.type = "button";
    prev.textContent = "‹";
    prev.onclick = () => { calendarDate.setDate(calendarDate.getDate() - 1); renderList(); };
    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "›";
    next.onclick = () => { calendarDate.setDate(calendarDate.getDate() + 1); renderList(); };
    const label = document.createElement("div");
    label.className = "label";
    label.title = "Jump to today";
    const main = document.createElement("div");
    main.textContent = isToday ? "Today" : calendarDate.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = calendarDate.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    label.append(main, sub);
    label.onclick = () => { calendarDate = new Date(); renderList(); };
    nav.append(prev, label, next);
    view.appendChild(nav);

    const dueToday = collectDueTasks().filter(e => sameDay(new Date(e.item.due), calendarDate));
    const allDayToday = dueToday.filter(e => e.item.dueAllDay);
    const timedToday = dueToday.filter(e => !e.item.dueAllDay);

    if (allDayToday.length) {
      const allDayRow = document.createElement("div");
      allDayRow.className = "hour-row allday-row";
      const allDayLabel = document.createElement("div");
      allDayLabel.className = "hourlabel";
      allDayLabel.textContent = "All day";
      const allDaySlot = document.createElement("div");
      allDaySlot.className = "slot";
      allDayToday.forEach(e => {
        const overdue = isOverdue(e.item);
        const block = document.createElement("div");
        block.className = "task-block" + (overdue ? " overdue" : "");
        if (e.list.color) block.style.setProperty("--tab-color", e.list.color);
        block.onclick = () => completeDueTask(e);
        block.append(e.item.text);
        if (state.lists.length > 1) {
          const t = document.createElement("span");
          t.className = "t";
          t.textContent = e.list.name;
          block.appendChild(t);
        }
        allDaySlot.appendChild(block);
      });
      allDayRow.append(allDayLabel, allDaySlot);
      view.appendChild(allDayRow);
    }

    const grid = document.createElement("div");
    grid.className = "hourgrid";
    for (let h = 0; h < 24; h++) {
      const row = document.createElement("div");
      row.className = "hour-row";
      const hourLabel = document.createElement("div");
      hourLabel.className = "hourlabel";
      hourLabel.textContent = new Date(2000, 0, 1, h).toLocaleTimeString(undefined, { hour: "numeric" });
      const slot = document.createElement("div");
      slot.className = "slot";
      timedToday.filter(e => new Date(e.item.due).getHours() === h).forEach(e => {
        const overdue = isOverdue(e.item);
        const block = document.createElement("div");
        block.className = "task-block" + (overdue ? " overdue" : "");
        if (e.list.color) block.style.setProperty("--tab-color", e.list.color);
        block.onclick = () => completeDueTask(e);
        block.append(e.item.text);
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = formatDue(e.item.due, e.item.dueAllDay) + (state.lists.length > 1 ? " · " + e.list.name : "");
        block.appendChild(t);
        slot.appendChild(block);
      });
      row.append(hourLabel, slot);
      grid.appendChild(row);
    }
    view.appendChild(grid);
    list.appendChild(view);

    requestAnimationFrame(() => {
      const targetHour = isToday ? today.getHours() : (timedToday[0] ? new Date(timedToday[0].item.due).getHours() : 8);
      const rows = grid.querySelectorAll(".hour-row");
      if (rows[targetHour]) list.scrollTop = Math.max(0, rows[targetHour].offsetTop - 30);
    });
  }

  function agendaTimeText(iso, groupKey, allDay) {
    if (allDay) return "All day";
    const d = new Date(iso);
    if (groupKey === "today" || groupKey === "tomorrow") {
      return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }
    if (groupKey === "week") return d.toLocaleDateString(undefined, { weekday: "short" });
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function renderCalendarAgenda() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const due = collectDueTasks();
    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const tomorrow0 = new Date(today0); tomorrow0.setDate(tomorrow0.getDate() + 1);
    const afterTomorrow0 = new Date(today0); afterTomorrow0.setDate(afterTomorrow0.getDate() + 2);
    const weekEnd0 = new Date(today0); weekEnd0.setDate(weekEnd0.getDate() + 7);

    const groups = { today: [], tomorrow: [], week: [], later: [] };
    due.forEach(e => {
      const d = new Date(e.item.due);
      if (d < tomorrow0) groups.today.push(e);
      else if (d < afterTomorrow0) groups.tomorrow.push(e);
      else if (d < weekEnd0) groups.week.push(e);
      else groups.later.push(e);
    });

    const GROUP_LABELS = { today: "Today", tomorrow: "Tomorrow", week: "This week", later: "Later" };
    let any = false;
    ["today", "tomorrow", "week", "later"].forEach(key => {
      const items = groups[key];
      if (!items.length) return;
      any = true;
      const g = document.createElement("div");
      g.className = "agenda-group";
      const heading = document.createElement("div");
      heading.className = "agenda-heading";
      heading.append(GROUP_LABELS[key]);
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = items.length;
      heading.appendChild(n);
      g.appendChild(heading);
      const listWrap = document.createElement("div");
      listWrap.className = "cal-list";
      items.forEach(e => {
        listWrap.appendChild(buildCalChip(e, { timeText: agendaTimeText(e.item.due, key, e.item.dueAllDay), showList: true }));
      });
      g.appendChild(listWrap);
      view.appendChild(g);
    });

    if (!any) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No upcoming due tasks.";
      view.appendChild(empty);
    }

    list.appendChild(view);
  }

  function renderCalendarMonth() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const due = collectDueTasks();
    const dueDates = new Set(due.map(e => {
      const d = new Date(e.item.due);
      return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    }));

    const nav = document.createElement("div");
    nav.className = "cal-nav";
    const prev = document.createElement("button");
    prev.type = "button";
    prev.textContent = "‹";
    prev.onclick = () => { calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1); renderList(); };
    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "›";
    next.onclick = () => { calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1); renderList(); };
    const monthLabel = document.createElement("div");
    monthLabel.className = "month";
    monthLabel.textContent = calendarDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    nav.append(prev, monthLabel, next);
    view.appendChild(nav);

    const grid = document.createElement("div");
    grid.className = "cal-grid";
    ["S", "M", "T", "W", "T", "F", "S"].forEach(d => {
      const dow = document.createElement("div");
      dow.className = "dow";
      dow.textContent = d;
      grid.appendChild(dow);
    });

    const firstOfMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
    const gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - firstOfMonth.getDay());

    const today = new Date();
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const inMonth = d.getMonth() === calendarDate.getMonth();
      const dayBtn = document.createElement("button");
      dayBtn.type = "button";
      dayBtn.className = "cal-day"
        + (inMonth ? "" : " muted")
        + (sameDay(d, today) ? " today" : "")
        + (!sameDay(d, today) && sameDay(d, calendarDate) ? " selected" : "");
      dayBtn.append(String(d.getDate()));
      if (dueDates.has(d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate())) {
        const mark = document.createElement("span");
        mark.className = "mark";
        dayBtn.appendChild(mark);
      }
      dayBtn.onclick = () => { calendarDate = d; renderList(); };
      grid.appendChild(dayBtn);
    }
    view.appendChild(grid);

    const daytasks = document.createElement("div");
    daytasks.className = "cal-daytasks";
    const heading = document.createElement("div");
    heading.className = "heading";
    heading.textContent = sameDay(calendarDate, today)
      ? "Today"
      : calendarDate.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    daytasks.appendChild(heading);

    const dayTasks = due.filter(e => sameDay(new Date(e.item.due), calendarDate));
    const listWrap = document.createElement("div");
    listWrap.className = "cal-list";
    if (!dayTasks.length) {
      const empty = document.createElement("div");
      empty.className = "hint";
      empty.textContent = "Nothing due this day.";
      listWrap.appendChild(empty);
    } else {
      dayTasks.forEach(e => listWrap.appendChild(buildCalChip(e, { showList: true })));
    }
    daytasks.appendChild(listWrap);
    view.appendChild(daytasks);

    list.appendChild(view);
  }

  function toggleDueEdit(i, container) {
    const existing = container.querySelector(".due-edit");
    if (existing) {
      // Weekday/monthly-occurrence picks save() without a full renderList
      // (so the panel stays open across multiple picks) — refresh here so
      // the row's "↻ Weekly (...)" label reflects them once it closes.
      renderList();
      return;
    }

    const items = activeList().items;
    const wrap = document.createElement("div");
    wrap.className = "due-edit";

    const row = document.createElement("div");
    row.className = "due-edit-row";

    const calBtn = document.createElement("button");
    calBtn.type = "button";
    calBtn.className = "cal-btn";
    calBtn.textContent = "📅";
    calBtn.title = "Pick a date";

    const dateInp = document.createElement("input");
    dateInp.type = "date";

    const hourInp = document.createElement("input");
    hourInp.type = "number";
    hourInp.min = "1";
    hourInp.max = "12";
    hourInp.className = "time-num";
    hourInp.title = "Hour";

    const minuteInp = document.createElement("input");
    minuteInp.type = "number";
    minuteInp.min = "0";
    minuteInp.max = "59";
    minuteInp.className = "time-num";
    minuteInp.title = "Minute";

    const ampmSelect = document.createElement("select");
    ampmSelect.className = "ampm-select";
    ["AM", "PM"].forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      ampmSelect.appendChild(opt);
    });

    function setTimeFields(hhmm) {
      const { hour, minute, ampm } = to12Hour(hhmm);
      hourInp.value = hour;
      minuteInp.value = String(minute).padStart(2, "0");
      ampmSelect.value = ampm;
    }
    function getTimeValue() {
      const h = Math.min(12, Math.max(1, Number(hourInp.value) || 12));
      const m = Math.min(59, Math.max(0, Number(minuteInp.value) || 0));
      return to24HourValue(h, m, ampmSelect.value);
    }

    calBtn.onclick = () => {
      if (typeof dateInp.showPicker === "function") dateInp.showPicker();
      else dateInp.focus();
    };

    if (items[i].due) {
      dateInp.value = toDateInputValue(items[i].due);
      setTimeFields(toTimeInputValue(items[i].due));
    } else {
      setTimeFields("09:00");
    }

    const allDayLabel = document.createElement("label");
    allDayLabel.className = "allday-toggle";
    const allDayCheckbox = document.createElement("input");
    allDayCheckbox.type = "checkbox";
    allDayCheckbox.checked = !!items[i].dueAllDay;
    allDayLabel.append(allDayCheckbox, "All day");

    function updateTimeFieldsVisibility() {
      const allDay = allDayCheckbox.checked;
      hourInp.hidden = allDay;
      minuteInp.hidden = allDay;
      ampmSelect.hidden = allDay;
    }
    updateTimeFieldsVisibility();

    const commitDue = () => {
      if (!dateInp.value) return;
      const time = allDayCheckbox.checked ? "00:00" : getTimeValue();
      items[i].due = new Date(`${dateInp.value}T${time}`).toISOString();
      items[i].dueAllDay = allDayCheckbox.checked;
      items[i].notified = false;
      save(); renderList();
    };
    dateInp.onchange = commitDue;
    hourInp.onchange = commitDue;
    minuteInp.onchange = commitDue;
    ampmSelect.onchange = commitDue;
    allDayCheckbox.onchange = () => {
      updateTimeFieldsVisibility();
      commitDue();
    };

    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "Clear";
    clearBtn.onclick = () => {
      items[i].due = null;
      items[i].dueAllDay = false;
      items[i].notified = false;
      items[i].repeat = null;
      items[i].repeatDays = null;
      items[i].repeatWeekday = null;
      items[i].repeatOccurrence = null;
      save(); renderList();
    };

    row.append(calBtn, dateInp, hourInp, minuteInp, ampmSelect, allDayLabel, clearBtn);

    const repeatSelect = document.createElement("select");
    [["", "Doesn't repeat"], ["daily", "Repeats daily"], ["weekly", "Repeats weekly"], ["monthly", "Repeats monthly"]]
      .forEach(([value, label]) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        if ((items[i].repeat || "") === value) opt.selected = true;
        repeatSelect.appendChild(opt);
      });
    repeatSelect.onchange = () => {
      items[i].repeat = repeatSelect.value || null;
      save(); renderList();
    };

    // Weekly day-of-week picker. Selecting "weekly" from repeatSelect closes
    // this whole panel (its onchange saves + re-renders, same as every other
    // field here) — so by the time this row is ever visible, items[i].repeat
    // is already "weekly" and items[i].due already reflects the saved date.
    // Defaulting to that date's weekday, and toggling days without a
    // re-render, is what lets multiple days be picked in one sitting.
    const weekdayRow = document.createElement("div");
    weekdayRow.className = "due-edit-row weekday-row";
    weekdayRow.hidden = items[i].repeat !== "weekly";
    const selectedDays = new Set(parseRepeatDays(items[i].repeatDays));
    if (items[i].repeat === "weekly" && !selectedDays.size && items[i].due) {
      selectedDays.add(new Date(items[i].due).getDay());
      items[i].repeatDays = [...selectedDays].join(",");
    }
    WEEKDAY_ABBR.forEach((label, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "weekday-btn" + (selectedDays.has(idx) ? " selected" : "");
      btn.textContent = label;
      btn.onclick = () => {
        if (selectedDays.has(idx)) selectedDays.delete(idx); else selectedDays.add(idx);
        items[i].repeatDays = selectedDays.size ? [...selectedDays].sort((a, b) => a - b).join(",") : null;
        btn.classList.toggle("selected", selectedDays.has(idx));
        save();
      };
      weekdayRow.appendChild(btn);
    });

    // Monthly Nth-weekday picker — same "closes on repeat-type change,
    // already-saved by the time it's shown" reasoning as the weekly row.
    const monthlyRow = document.createElement("div");
    monthlyRow.className = "due-edit-row";
    monthlyRow.hidden = items[i].repeat !== "monthly";
    if (items[i].repeat === "monthly" && items[i].repeatWeekday == null && items[i].due) {
      const d = new Date(items[i].due);
      items[i].repeatWeekday = d.getDay();
      items[i].repeatOccurrence = occurrenceInMonth(d);
    }
    const monthOccurrenceSelect = document.createElement("select");
    [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "4th"], [-1, "Last"]].forEach(([value, label]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = label;
      if ((items[i].repeatOccurrence ?? 1) === value) opt.selected = true;
      monthOccurrenceSelect.appendChild(opt);
    });
    const monthWeekdaySelect = document.createElement("select");
    WEEKDAY_ABBR.forEach((label, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = label;
      if ((items[i].repeatWeekday ?? 0) === idx) opt.selected = true;
      monthWeekdaySelect.appendChild(opt);
    });
    monthOccurrenceSelect.onchange = () => {
      items[i].repeatOccurrence = Number(monthOccurrenceSelect.value);
      save();
    };
    monthWeekdaySelect.onchange = () => {
      items[i].repeatWeekday = Number(monthWeekdaySelect.value);
      save();
    };
    monthlyRow.append(monthOccurrenceSelect, monthWeekdaySelect);

    wrap.append(row, repeatSelect, weekdayRow, monthlyRow);
    container.appendChild(wrap);
    dateInp.focus();
  }

  function edit(i, el) {
    const items = activeList().items;
    const inp = document.createElement("input");
    inp.value = items[i].text;
    inp.style.cssText = "flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:6px;color:var(--text);padding:4px 6px;font:inherit;outline:none";
    el.replaceWith(inp);
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    const commit = () => {
      const v = inp.value.trim();
      if (v) items[i].text = v; else items.splice(i, 1);
      save(); renderList();
    };
    inp.onblur = commit;
    inp.onkeydown = e => {
      if (e.key === "Enter") inp.blur();
      if (e.key === "Escape") { inp.onblur = null; renderList(); }
    };
  }

  // What the add-item form creates on submit. Defaults to "task" each
  // session; toggled per-submission via addTypeToggle, not persisted.
  let addItemType = "task";
  const addTypeToggle = document.getElementById("addTypeToggle");
  addTypeToggle.onclick = () => {
    addItemType = addItemType === "task" ? "note" : "task";
    const isNoteMode = addItemType === "note";
    addTypeToggle.classList.toggle("note-mode", isNoteMode);
    addTypeToggle.textContent = isNoteMode ? "📝" : "☑";
    addTypeToggle.title = isNoteMode
      ? "Adding a note — click to switch to a task"
      : "Adding a task — click to switch to a note";
    input.placeholder = isNoteMode ? "Add a note…" : "Add a task…";
  };

  // Pasting a single line into the add-task box behaves like normal typing.
  // Pasting an outline (2+ non-blank lines) instead imports it via
  // importOutlineText rather than dumping newlines into a single-line input.
  input.addEventListener("paste", ev => {
    const text = (ev.clipboardData || window.clipboardData).getData("text/plain");
    if (!text) return;
    const nonBlankLines = text.split(/\r?\n/).filter(l => l.trim()).length;
    if (nonBlankLines < 2) return;
    ev.preventDefault();
    importOutlineText(text);
  });

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    const newItem = addItemType === "note"
      ? { _id: uid(), type: "note", text: v }
      : {
        _id: uid(), type: "task", text: v, done: false, due: null, dueAllDay: false, notified: false,
        pinned: false, repeat: null, repeatDays: null, repeatWeekday: null,
        repeatOccurrence: null, completedAt: null, note: null,
      };
    activeList().items.push(newItem);
    pendingEnterId = newItem._id;
    input.value = "";
    playPopSound();
    save(); renderList();
  };

  const backBtn = document.getElementById("backBtn");
  const calStyleBtn = document.getElementById("calStyleBtn");
  const sortBtn = document.getElementById("sortBtn");
  const calendarBtn = document.getElementById("calendarBtn");
  const archiveBtn = document.getElementById("archiveBtn");
  const trashBtn = document.getElementById("trashBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const tabsContainer = document.getElementById("tabs");
  const addForm = document.getElementById("form");

  function setViewMode(mode) {
    viewMode = viewMode === mode ? "active" : mode;
    backBtn.hidden = viewMode === "active";
    calStyleBtn.hidden = viewMode !== "calendar";
    calendarBtn.classList.toggle("active", viewMode === "calendar");
    archiveBtn.classList.toggle("active", viewMode === "completed");
    trashBtn.classList.toggle("active", viewMode === "trash");
    settingsBtn.classList.toggle("active", viewMode === "settings");
    addForm.hidden = viewMode !== "active";
    tabsContainer.hidden = viewMode !== "active";
    renderList();
  }

  backBtn.onclick = () => setViewMode("active");
  calendarBtn.onclick = () => setViewMode("calendar");
  archiveBtn.onclick = () => setViewMode("completed");
  trashBtn.onclick = () => setViewMode("trash");
  settingsBtn.onclick = () => setViewMode("settings");

  const CALENDAR_STYLES = [
    ["day", "Day view (hour grid)"],
    ["agenda", "Agenda list"],
    ["month", "Mini month calendar"],
  ];

  calStyleBtn.onclick = ev => {
    closeTabMenu();
    const menu = document.createElement("div");
    menu.className = "tab-menu";
    menu.onclick = e => e.stopPropagation();

    CALENDAR_STYLES.forEach(([value, text]) => {
      const item = document.createElement("button");
      item.className = "tab-menu-item";
      item.textContent = (state.settings.calendarView === value ? "✓ " : "　 ") + text;
      item.onclick = () => {
        state.settings.calendarView = value;
        save();
        closeTabMenu();
        renderList();
      };
      menu.appendChild(item);
    });

    document.body.appendChild(menu);
    const rect = calStyleBtn.getBoundingClientRect();
    const menuWidth = menu.offsetWidth;
    const maxX = window.innerWidth - menuWidth - 8;
    menu.style.left = Math.max(8, Math.min(rect.left, maxX)) + "px";
    menu.style.top = (rect.bottom + 6) + "px";

    tabMenuCloser = closeTabMenu;
    document.addEventListener("click", tabMenuCloser);
    ev.stopPropagation();
  };

  const SORT_OPTIONS = [
    ["due", "Due date", (a, b) => {
      if (a.due && b.due) return new Date(a.due) - new Date(b.due);
      if (a.due) return -1;
      if (b.due) return 1;
      return 0;
    }],
    ["alpha", "A–Z", (a, b) => a.text.toLowerCase().localeCompare(b.text.toLowerCase())],
  ];

  sortBtn.onclick = ev => {
    closeTabMenu();
    const menu = document.createElement("div");
    menu.className = "tab-menu";
    menu.onclick = e => e.stopPropagation();

    SORT_OPTIONS.forEach(([value, text, comparator]) => {
      const item = document.createElement("button");
      item.className = "tab-menu-item";
      item.textContent = text;
      item.onclick = () => {
        activeList().items.sort(comparator);
        closeTabMenu();
        save();
        renderList();
      };
      menu.appendChild(item);
    });

    document.body.appendChild(menu);
    const rect = sortBtn.getBoundingClientRect();
    const menuWidth = menu.offsetWidth;
    const maxX = window.innerWidth - menuWidth - 8;
    menu.style.left = Math.max(8, Math.min(rect.left, maxX)) + "px";
    menu.style.top = (rect.bottom + 6) + "px";

    tabMenuCloser = closeTabMenu;
    document.addEventListener("click", tabMenuCloser);
    ev.stopPropagation();
  };

  // Called from Python (vault_sync poll loop / launch reconcile) after it
  // has merged today's note against backup.json. `jsonStateString` is the
  // full merged state, already reconciled — just adopt it, same as
  // recoverFromBackupIfNewer does for the backup-is-newer case.
  window.__applySyncedState = function (jsonStateString) {
    let merged;
    try {
      merged = JSON.parse(jsonStateString);
    } catch {
      return;
    }
    if (!merged || !Array.isArray(merged.lists)) return;

    state = merged;
    state.lists.forEach(l => {
      normalizeItems(l.items);
      if (l.color === undefined) l.color = null;
      if (l.syncToVault === undefined) l.syncToVault = true;
    });
    if (!Array.isArray(state.tombstones)) state.tombstones = [];
    lastItemFields = snapshotItemFields(state);
    save();
    if (!document.querySelector(".due-edit")) {
      renderTabs();
      renderList();
    }
  };

  // Called periodically from Python (even while the window is hidden in the
  // tray) to find due tasks and hand back native-notification payloads.
  window.__checkDueTasks = function () {
    const now = Date.now();
    const dueNow = [];
    state.lists.forEach(l => {
      l.items.forEach(it => {
        if (it.due && !it.dueAllDay && !it.done && !it.notified && new Date(it.due).getTime() <= now) {
          it.notified = true;
          dueNow.push({ list: l.name, text: it.text });
        }
      });
    });
    if (dueNow.length) {
      save();
      // Don't yank an in-progress edit out from under the user — the next
      // render (tab switch, add, toggle, etc.) will pick up the change.
      if (!document.querySelector(".due-edit")) renderList();
    }
    return JSON.stringify(dueNow);
  };

  purgeExpiredCompleted();
  setInterval(purgeExpiredCompleted, 60 * 1000);
  setInterval(purgeExpiredTrash, 60 * 1000);

  renderTabs();
  renderList();

  // window.pywebview.api isn't ready until "pywebviewready" fires, but
  // relying on that event alone was flaky on relaunch — if it fires
  // before this listener attaches (a real race, not just theoretical),
  // vibrancy silently never gets (re)applied for that whole session.
  // Poll as a guaranteed fallback alongside the event.
  window.addEventListener("pywebviewready", () => applyVibrancy(state.settings.vibrancy), { once: true });
  (function ensureVibrancyApplied() {
    if (!state.settings.vibrancy) return;
    if (window.pywebview && window.pywebview.api) {
      applyVibrancy(true);
    } else {
      setTimeout(ensureVibrancyApplied, 200);
    }
  })();

  // Same "poll until the bridge exists" approach as vibrancy above —
  // check the Python-side backup once the API is ready, and recover
  // from it if it turns out to have more tasks than localStorage did.
  (function checkBackupWhenReady() {
    if (window.pywebview && window.pywebview.api) {
      recoverFromBackupIfNewer();
    } else {
      setTimeout(checkBackupWhenReady, 200);
    }
  })();
</script>
