<meta charset="utf-8">
<title>List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2b2f38;
    --text: #e7e9ee;
    --muted: #8b909c;
    --accent: #6ea8fe;
    --done: #565b66;
    --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e7e9ee;
      --text: #1c1e24;
      --muted: #8b909c;
      --accent: #2f6fed;
      --done: #b3b7c0;
      --danger: #e0483d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: flex-start;
    -webkit-user-select: none;
    user-select: none;
  }
  body.vibrancy { background: rgba(22, 24, 29, 0.9); }
  @media (prefers-color-scheme: light) {
    body.vibrancy { background: rgba(246, 247, 249, 0.9); }
  }
  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    /* left padding clears the traffic-light buttons, which float directly
       over the content now that the titlebar is transparent — top padding
       is kept tight so this row reads as part of that same corner instead
       of a separate bar floating below it */
    padding: 16px 24px 10px 72px;
  }
  header .count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 25px;
    padding: 5px 8px;
    line-height: 1;
    flex: none;
  }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn.active { color: var(--accent); }

  .settings-view { padding: 8px 20px; }
  .settings-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .settings-row label { font-size: 14px; font-weight: 500; }
  .settings-row .hint { font-size: 12px; color: var(--muted); }
  .settings-row select {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    outline: none;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    .settings-row select { color-scheme: light; }
  }
  .settings-switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 24px;
    flex: none;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    background: var(--line);
    border-radius: 24px;
    cursor: pointer;
    transition: background .15s;
  }
  .switch-track::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s;
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::before { transform: translateX(16px); }

  /* ---- calendar: shared ---- */
  .cal-view { padding: 4px 14px 14px; }
  .cal-chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid var(--tab-color, var(--line));
    cursor: pointer;
  }
  .cal-chip .box {
    width: 15px; height: 15px;
    border: 2px solid var(--muted);
    border-radius: 5px;
    flex: none;
    cursor: pointer;
  }
  .cal-chip .txt { font-size: 12.5px; flex: 1; min-width: 0; word-break: break-word; }
  .cal-chip .listname { font-size: 10.5px; color: var(--muted); }
  .cal-chip .time {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex: none;
    white-space: nowrap;
  }
  .cal-chip.overdue .time { color: var(--danger); }

  /* ---- calendar: day view ---- */
  .daynav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .daynav button {
    background: none; border: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 2px 10px;
  }
  .daynav button:hover { color: var(--accent); }
  .daynav .label { font-size: 13.5px; font-weight: 600; text-align: center; cursor: pointer; }
  .daynav .label .sub { color: var(--muted); font-weight: 400; font-size: 11px; display: block; }
  .hour-row {
    display: flex;
    gap: 10px;
    min-height: 44px;
    border-top: 1px solid var(--line);
    padding-top: 5px;
  }
  .hour-row .hourlabel {
    width: 42px;
    flex: none;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  .hour-row .slot { flex: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 5px; min-width: 0; }
  .task-block {
    background: color-mix(in srgb, var(--tab-color, var(--accent)) 22%, var(--panel));
    border-left: 3px solid var(--tab-color, var(--accent));
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11.5px;
    line-height: 1.3;
    cursor: pointer;
  }
  .task-block.overdue { border-left-color: var(--danger); }
  .task-block .t { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }

  /* ---- calendar: month view ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .cal-nav button {
    background: none; border: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 2px 10px;
  }
  .cal-nav button:hover { color: var(--accent); }
  .cal-nav .month { font-size: 14px; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 10px;
  }
  .cal-grid .dow {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text);
    background: none;
    border: none;
    position: relative;
    cursor: pointer;
    font: inherit;
  }
  .cal-day:hover { background: var(--panel); }
  .cal-day.muted { color: var(--done); }
  .cal-day.today { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.selected:not(.today) { border: 1.5px solid var(--accent); }
  .cal-day .mark {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    bottom: 4px;
  }
  .cal-day.today .mark { background: #fff; }
  .cal-daytasks { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; }
  .cal-daytasks .heading { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
  .cal-list { display: flex; flex-direction: column; gap: 6px; }

  /* ---- calendar: agenda view ---- */
  .agenda-group { margin-top: 16px; }
  .agenda-group:first-child { margin-top: 4px; }
  .agenda-heading {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .agenda-heading .n {
    background: var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 600;
  }

  .completed-at {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .restore-btn {
    opacity: 0;
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 13px;
    flex: none;
  }
  li:hover .restore-btn { opacity: 1; }
  .restore-btn:hover { color: var(--accent); }

  .tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px 10px;
    overflow-x: auto;
    flex: none;
  }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    flex: none;
    border: 1px solid transparent;
  }
  .tab:hover { background: var(--panel); }
  .tab.active {
    background: var(--tab-color, var(--accent));
    color: #fff;
  }
  .tab .tab-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex: none;
    background: var(--tab-color, var(--muted));
  }
  .tab.active .tab-dot { display: none; }
  .tab .tab-x {
    opacity: 0;
    font-size: 14px;
    line-height: 1;
    padding: 0 1px;
  }
  .tab:hover .tab-x { opacity: .7; }
  .tab .tab-x:hover { opacity: 1 !important; color: #fff; }

  .tab-menu {
    position: fixed;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    width: 190px;
  }
  .tab-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-menu-item:hover { background: var(--bg); }
  .tab-menu-item.danger { color: var(--danger); }
  .tab-menu-label {
    font-size: 11px;
    color: var(--muted);
    padding: 6px 8px 2px;
  }
  .tab-menu-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 8px 6px;
  }
  .tab-menu-swatch {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex: none;
  }
  .tab-menu-swatch.selected { border-color: var(--text); }
  .tab-menu-wheel-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 8px 3px 6px;
    border-radius: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    flex: none;
  }
  .tab-menu-wheel-label:hover { color: var(--accent); border-color: var(--accent); }
  .tab-menu-wheel {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid var(--line);
    padding: 0;
    cursor: pointer;
    flex: none;
    overflow: hidden;
  }
  .tab-menu-wheel::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .tab-menu-wheel::-webkit-color-swatch { border: none; border-radius: 50%; }
  .tab-menu-sep { border-top: 1px solid var(--line); margin: 4px 0; }
  .tab-add {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px dashed var(--line);
    color: var(--muted);
    background: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); }
  .tab-name-input {
    border: none;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 90px;
  }

  .add {
    display: flex;
    gap: 8px;
    padding: 10px 20px 14px;
    border-top: 1px solid var(--line);
    flex: none;
  }
  /* the [hidden] attribute alone can't win against a plain-class display
     rule of equal specificity, so pair it with the class explicitly */
  .add[hidden], .tabs[hidden] { display: none; }
  .add input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    padding: 11px 13px;
    font-size: 15px;
    outline: none;
  }
  .add input:focus { border-color: var(--accent); }
  .add button {
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: #fff;
    width: 44px;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .add button:active { transform: scale(.96); }
  ul { list-style: none; overflow-y: auto; flex: 1; padding: 0 12px 16px; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 9px;
  }
  li:hover { background: var(--panel); }
  @keyframes item-enter {
    from { transform: translateX(-26px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes item-leave {
    to { transform: translateX(140%); opacity: 0; }
  }
  li.entering { animation: item-enter .3s cubic-bezier(.2,.8,.2,1); }
  li.leaving {
    animation: item-leave .32s cubic-bezier(.4,0,.6,1) forwards;
    pointer-events: none;
  }
  li.dragging { opacity: .35; }
  li.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  li.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .drag-handle {
    opacity: 0;
    color: var(--muted);
    font-size: 14px;
    flex: none;
    padding-top: 2px;
    cursor: grab;
  }
  li:hover .drag-handle { opacity: 1; }
  .box {
    width: 20px; height: 20px;
    margin-top: 1px;
    border: 2px solid var(--muted);
    border-radius: 6px;
    flex: none;
    cursor: pointer;
    position: relative;
    transition: .12s;
  }
  .box:hover { border-color: var(--accent); }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box::after {
    content: "";
    position: absolute; left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .txt-wrap { flex: 1; min-width: 0; }
  .txt { cursor: text; word-break: break-word; padding-top: 1px; }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  .due {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
    cursor: pointer;
    display: inline-block;
  }
  .due.overdue { color: var(--danger); }
  li.done .due { color: var(--done); }
  .row-actions {
    display: flex;
    align-items: center;
    flex: none;
    gap: 2px;
  }
  .pin-btn, .due-btn, .del {
    opacity: 0;
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    flex: none;
  }
  .pin-btn { font-size: 13px; }
  .due-btn { font-size: 14px; }
  .del { font-size: 18px; }
  li:hover .pin-btn, li:hover .due-btn, li:hover .del { opacity: 1; }
  .pin-btn.pinned { opacity: 1; color: var(--accent); }
  .pin-btn:hover { color: var(--accent); }
  .due-btn:hover { color: var(--accent); }
  .del:hover { color: var(--danger); }
  li.pinned-row { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .due-edit {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .due-edit-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .due-edit-row input[type="date"] {
    flex: 1 1 auto;
    min-width: 118px;
  }
  .due-edit input, .due-edit select {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    padding: 4px 6px;
    outline: none;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    .due-edit input, .due-edit select { color-scheme: light; }
  }
  .due-edit input.time-num {
    width: 38px;
    flex: none;
    text-align: center;
    -moz-appearance: textfield;
  }
  .due-edit input.time-num::-webkit-inner-spin-button,
  .due-edit input.time-num::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .due-edit select.ampm-select { padding: 4px 4px; flex: none; }
  .due-edit button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .due-edit button:hover { color: var(--danger); }
  .due-edit .cal-btn {
    font-size: 15px;
    padding: 2px 4px;
    flex: none;
  }
  .due-edit .cal-btn:hover { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  ul::-webkit-scrollbar { width: 8px; }
  ul::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>

<div class="app">
  <header>
    <button id="backBtn" class="icon-btn" title="Back" hidden>←</button>
    <span class="count" id="count"></span>
    <button id="calStyleBtn" class="icon-btn" title="Calendar layout" hidden>⋯</button>
    <button id="calendarBtn" class="icon-btn" title="Calendar">📅</button>
    <button id="archiveBtn" class="icon-btn" title="Completed tasks">🗂️</button>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <ul id="list"></ul>
  <form class="add" id="form">
    <input id="input" placeholder="Add a task…" autocomplete="off" autofocus>
    <button type="submit" title="Add">+</button>
  </form>
</div>

<script>
  const KEY = "todo.widget.v3";
  const OLD_KEY_V2 = "todo.widget.v2";
  const OLD_KEY_V1 = "todo.widget.v1";

  const LIST_COLORS = [
    "#6ea8fe", "#ff6b6b", "#ffa94d", "#ffd43b",
    "#69db7c", "#38d9a9", "#66d9e8", "#b197fc", "#f783ac",
  ];

  let state = load();
  let lastItemFields = snapshotItemFields(state);

  function snapshotItemFields(s) {
    const map = new Map();
    (s.lists || []).forEach(l => {
      (l.items || []).forEach(it => {
        map.set(it._id, { text: it.text, done: it.done, due: it.due, pinned: it.pinned, repeat: it.repeat });
      });
    });
    return map;
  }

  function fieldsEqual(a, b) {
    return a.text === b.text && a.done === b.done && a.due === b.due
      && a.pinned === b.pinned && a.repeat === b.repeat;
  }

  function stampUpdatedAtAndTombstones() {
    const now = new Date().toISOString();
    const currentIds = new Set();
    state.lists.forEach(l => {
      l.items.forEach(it => {
        currentIds.add(it._id);
        const prev = lastItemFields.get(it._id);
        const cur = { text: it.text, done: it.done, due: it.due, pinned: it.pinned, repeat: it.repeat };
        if (!prev || !fieldsEqual(prev, cur)) {
          it.updatedAt = now;
        }
      });
    });
    if (!Array.isArray(state.tombstones)) state.tombstones = [];
    const tombstoneIds = new Set(state.tombstones.map(t => t._id));
    lastItemFields.forEach((_, id) => {
      if (!currentIds.has(id) && !tombstoneIds.has(id)) {
        state.tombstones.push({ _id: id, updatedAt: now });
      }
    });
    lastItemFields = snapshotItemFields(state);
  }

  const tabsEl = document.getElementById("tabs");
  const list = document.getElementById("list");
  const input = document.getElementById("input");

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function normalizeItems(items) {
    (items || []).forEach(it => {
      if (it.due === undefined) it.due = null;
      if (it.notified === undefined) it.notified = false;
      if (it.pinned === undefined) it.pinned = false;
      if (it.repeat === undefined) it.repeat = null;
      if (it.completedAt === undefined) it.completedAt = null;
      if (it.updatedAt === undefined) it.updatedAt = new Date().toISOString();
      if (!it._id) it._id = uid();
    });
    return items || [];
  }

  // id of the item that should play its "enter" animation on the next
  // renderList() call — set right before adding/re-inserting an item.
  let pendingEnterId = null;

  // id of the item currently being drag-reordered in the active list.
  let draggedItemId = null;

  function reorderItem(draggedId, targetId, insertBefore) {
    const items = activeList().items;
    const fromIdx = items.findIndex(x => x._id === draggedId);
    if (fromIdx === -1) return;
    const [moved] = items.splice(fromIdx, 1);
    let toIdx = items.findIndex(x => x._id === targetId);
    if (toIdx === -1) {
      items.push(moved);
    } else {
      items.splice(insertBefore ? toIdx : toIdx + 1, 0, moved);
    }
    save();
    renderList();
  }

  // "active" shows open tasks; "completed" shows the current list's
  // finished tasks (still just a view over the same underlying data).
  let viewMode = "active";

  // The focused day in the calendar's day view, and the selected day in
  // its month view — reused across both since only one layout renders
  // at a time (picked in Settings).
  let calendarDate = new Date();

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // A warm, low-passed sine "thock" (with a sub-octave layer for body) —
  // a soft, buttery check sound rather than a bright digital blip.
  function playCheckSound() {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.3;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.19);
    filter.connect(gain).connect(ctx.destination);

    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t0);
    osc.frequency.exponentialRampToValueAtTime(180, t0 + 0.16);
    osc.connect(filter);
    osc.start(t0);
    osc.stop(t0 + 0.2);

    const sub = ctx.createOscillator();
    sub.type = "sine";
    sub.frequency.setValueAtTime(260, t0);
    sub.frequency.exponentialRampToValueAtTime(90, t0 + 0.16);
    sub.connect(filter);
    sub.start(t0);
    sub.stop(t0 + 0.2);
  }

  // Four soft, rounded "bubble" blips for adding a task — low-passed sine
  // waves with a gentle downward glide, warmer than a bright chirp.
  function playPopSound() {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;
    [460, 560, 660, 740].forEach((f, idx) => {
      const start = t0 + idx * 0.09;

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 1400;
      filter.Q.value = 0.3;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      filter.connect(gain).connect(ctx.destination);

      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f * 1.6, start);
      osc.frequency.exponentialRampToValueAtTime(f, start + 0.05);
      osc.connect(filter);
      osc.start(start);
      osc.stop(start + 0.14);
    });
  }

  function load() {
    let result = null;

    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && Array.isArray(raw.lists) && raw.lists.length) result = raw;
    } catch {}

    if (!result) {
      try {
        const v2 = JSON.parse(localStorage.getItem(OLD_KEY_V2));
        if (v2 && Array.isArray(v2.lists) && v2.lists.length) result = v2;
      } catch {}
    }

    if (!result) {
      let migrated = [];
      try { migrated = JSON.parse(localStorage.getItem(OLD_KEY_V1)) || []; } catch {}
      const firstList = { id: uid(), name: "Tasks", items: Array.isArray(migrated) ? migrated : [] };
      result = { lists: [firstList], active: firstList.id };
    }

    result.lists.forEach(l => {
      normalizeItems(l.items);
      if (l.color === undefined) l.color = null;
    });
    if (!result.settings) result.settings = {};
    if (!result.settings.retention) result.settings.retention = "endOfDay";
    if (result.settings.vibrancy === undefined) result.settings.vibrancy = false;
    if (!result.settings.calendarView) result.settings.calendarView = "day";
    if (!Array.isArray(result.tombstones)) result.tombstones = [];

    // One-time migration: the default first-list name changed from
    // "To-Do" to "Tasks". Only touch it once, so a list intentionally
    // renamed back to "To-Do" later doesn't get overwritten again.
    if (!result.migratedDefaultListName) {
      result.lists.forEach(l => { if (l.name === "To-Do") l.name = "Tasks"; });
      result.migratedDefaultListName = true;
    }

    return result;
  }

  function save() {
    stampUpdatedAtAndTombstones();
    const json = JSON.stringify(state);
    localStorage.setItem(KEY, json);
    // Belt-and-suspenders backup: written to a plain file with an
    // explicit fsync on the Python side, independent of whatever
    // WebKit's own (opaque, asynchronous) localStorage persistence is
    // doing. Fire-and-forget — don't block saves on it.
    if (window.pywebview && window.pywebview.api && window.pywebview.api.save_backup) {
      window.pywebview.api.save_backup(json).catch(() => {});
    }
  }

  function countAllItems(s) {
    return (s.lists || []).reduce((sum, l) => sum + (l.items || []).length, 0);
  }

  // If the Python-side backup has strictly more tasks than what we just
  // loaded from localStorage, localStorage lost data relative to the
  // last known-good backup — recover from the backup instead.
  function recoverFromBackupIfNewer() {
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.load_backup) return;
    window.pywebview.api.load_backup().then(raw => {
      if (!raw) return;
      let backup;
      try { backup = JSON.parse(raw); } catch { return; }
      if (!backup || !Array.isArray(backup.lists)) return;
      if (countAllItems(backup) > countAllItems(state)) {
        state = backup;
        state.lists.forEach(l => {
          normalizeItems(l.items);
          if (l.color === undefined) l.color = null;
        });
        if (!Array.isArray(state.tombstones)) state.tombstones = [];
        lastItemFields = snapshotItemFields(state);
        save();
        renderTabs();
        renderList();
      }
    }).catch(() => {});
  }

  function activeList() {
    return state.lists.find(l => l.id === state.active) || state.lists[0];
  }

  const RETENTION_HOURS = { "1h": 1, "6h": 6, "24h": 24 };

  // Removes completed tasks past their retention window. Completed tasks
  // stay in place (and viewable) otherwise — this only prunes old ones.
  function purgeExpiredCompleted() {
    const retention = state.settings.retention;
    if (retention === "never") return;

    const now = Date.now();
    let changed = false;

    state.lists.forEach(l => {
      const before = l.items.length;
      l.items = l.items.filter(it => {
        if (!it.done || !it.completedAt) return true;
        const completedAt = new Date(it.completedAt).getTime();
        if (retention === "endOfDay") {
          return new Date(completedAt).toDateString() === new Date(now).toDateString();
        }
        const hours = RETENTION_HOURS[retention] || 24;
        return now - completedAt < hours * 3600 * 1000;
      });
      if (l.items.length !== before) changed = true;
    });

    if (changed) save();
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    state.lists.forEach(l => {
      const tab = document.createElement("div");
      tab.className = "tab" + (l.id === state.active ? " active" : "");
      if (l.color) tab.style.setProperty("--tab-color", l.color);

      const dot = document.createElement("span");
      dot.className = "tab-dot";

      const name = document.createElement("span");
      name.className = "tab-name-text";
      name.textContent = l.name;
      name.ondblclick = ev => { ev.stopPropagation(); renameTab(l, tab, name); };

      tab.onclick = () => { state.active = l.id; save(); renderTabs(); renderList(); };
      tab.oncontextmenu = ev => {
        ev.preventDefault();
        ev.stopPropagation();
        showTabMenu(l, tab, ev.clientX, ev.clientY);
      };

      tab.append(dot, name);

      if (state.lists.length > 1) {
        const x = document.createElement("span");
        x.className = "tab-x";
        x.textContent = "×";
        x.title = "Delete list";
        x.onclick = ev => {
          ev.stopPropagation();
          if (!confirm(`Delete the "${l.name}" list and all its tasks?`)) return;
          state.lists = state.lists.filter(x2 => x2.id !== l.id);
          if (state.active === l.id) state.active = state.lists[0].id;
          save(); renderTabs(); renderList();
        };
        tab.appendChild(x);
      }

      tabsEl.appendChild(tab);
    });

    const addBtn = document.createElement("button");
    addBtn.className = "tab-add";
    addBtn.textContent = "+";
    addBtn.title = "New list";
    addBtn.onclick = () => {
      const l = { id: uid(), name: "New list", items: [], color: null };
      state.lists.push(l);
      state.active = l.id;
      save(); renderTabs(); renderList();
      requestAnimationFrame(() => {
        const tabs = tabsEl.querySelectorAll(".tab");
        const lastTab = tabs[tabs.length - 1];
        const nameEl = lastTab && lastTab.querySelector(".tab-name-text");
        if (lastTab && nameEl) renameTab(l, lastTab, nameEl, true);
      });
    };
    tabsEl.appendChild(addBtn);
  }

  function renameTab(l, tab, nameEl, selectAll) {
    const inp = document.createElement("input");
    inp.className = "tab-name-input";
    inp.value = l.name;
    nameEl.replaceWith(inp);
    inp.focus();
    if (selectAll) inp.select(); else inp.setSelectionRange(inp.value.length, inp.value.length);
    const commit = () => {
      const v = inp.value.trim();
      l.name = v || l.name;
      save(); renderTabs(); renderList();
    };
    inp.onblur = commit;
    inp.onkeydown = e => {
      if (e.key === "Enter") inp.blur();
      if (e.key === "Escape") { inp.onblur = null; renderTabs(); }
    };
    inp.onclick = ev => ev.stopPropagation();
  }

  let tabMenuCloser = null;

  function closeTabMenu() {
    if (tabMenuCloser) {
      document.removeEventListener("click", tabMenuCloser);
      tabMenuCloser = null;
    }
    const existing = document.querySelector(".tab-menu");
    if (existing) existing.remove();
  }

    closeTabMenu();

    const menu = document.createElement("div");
    menu.className = "tab-menu";

    LIST_COLORS.forEach(color => {
      const swatch = document.createElement("button");

      swatch.style.background = color;

      };
      colors.appendChild(swatch);
    });

    const wheelLabel = document.createElement("label");
    wheelLabel.className = "tab-menu-wheel-label";
    wheelLabel.title = "Custom color";
    wheelLabel.append("🎨 Custom");

    const wheel = document.createElement("input");
    wheel.type = "color";
    wheel.className = "tab-menu-wheel";
    wheel.value = l.color && /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : "#6ea8fe";
    wheel.onchange = () => {

      save(); renderTabs(); renderList();
    };
    wheelLabel.appendChild(wheel);
    colors.appendChild(wheelLabel);

    menu.appendChild(colors);

    if (state.lists.length > 1) {
      menu.appendChild(Object.assign(document.createElement("div"), { className: "tab-menu-sep" }));
      const deleteBtn = document.createElement("button");
      deleteBtn.className = "tab-menu-item danger";
      deleteBtn.textContent = "Delete list";
      deleteBtn.onclick = () => {
        closeTabMenu();
        if (!confirm(`Delete the "${l.name}" list and all its tasks?`)) return;
        state.lists = state.lists.filter(x => x.id !== l.id);
        if (state.active === l.id) state.active = state.lists[0].id;
        save(); renderTabs(); renderList();
      };
      menu.appendChild(deleteBtn);
    }

    document.body.appendChild(menu);

    const menuWidth = menu.offsetWidth;
    const menuHeight = menu.offsetHeight;
    const maxX = window.innerWidth - menuWidth - 8;
    const maxY = window.innerHeight - menuHeight - 8;
    menu.style.left = Math.max(8, Math.min(x, maxX)) + "px";
    menu.style.top = Math.max(8, Math.min(y, maxY)) + "px";

    tabMenuCloser = closeTabMenu;
    document.addEventListener("click", tabMenuCloser);
  }

  function toDateInputValue(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function toTimeInputValue(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Native <input type="time"> follows the system's regional format —
  // on a 24-hour locale it never shows AM/PM at all. Use explicit
  // hour/minute/AM-PM controls instead so it's consistent everywhere.
  function to12Hour(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    let hour = h % 12;
    if (hour === 0) hour = 12;
    return { hour, minute: m, ampm };
  }

  function to24HourValue(hour12, minute, ampm) {
    let h = Number(hour12) % 12;
    if (ampm === "PM") h += 12;
    return `${String(h).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
  }

  function formatDue(iso) {
    const d = new Date(iso);
    const sameDay = d.toDateString() === new Date().toDateString();
    const opts = sameDay
      ? { hour: "numeric", minute: "2-digit" }
      : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
    return d.toLocaleString(undefined, opts);
  }

  function repeatLabel(r) {
    return r === "daily" ? "Daily" : r === "weekly" ? "Weekly" : r === "monthly" ? "Monthly" : "";
  }

  function nextOccurrence(iso, repeat) {
    const d = new Date(iso);
    if (repeat === "daily") d.setDate(d.getDate() + 1);
    else if (repeat === "weekly") d.setDate(d.getDate() + 7);
    else if (repeat === "monthly") d.setMonth(d.getMonth() + 1);
    return d.toISOString();
  }

  function renderList() {
    if (viewMode === "completed") renderCompletedList();
    else if (viewMode === "settings") renderSettingsView();
    else if (viewMode === "calendar") renderCalendarView();
    else renderActiveList();
  }

  function renderActiveList() {
    const al = activeList();
    const items = al.items;
    list.innerHTML = "";

    // Completed items stay in the data (for counts / the completed view)
    // but are never rendered here again once done — they "leave" via the
    // animation in box.onclick, right before this function runs.
    const order = items.map((_, i) => i)
      .filter(i => !items[i].done)
      .sort((a, b) => (items[b].pinned ? 1 : 0) - (items[a].pinned ? 1 : 0));

    if (!order.length) {
      list.innerHTML = '<div class="empty">Nothing here yet — add your first task above.</div>';
    }

    order.forEach(i => {
      const it = items[i];
      const li = document.createElement("li");
      li.className = (it.pinned ? "pinned-row " : "");
      if (it._id && it._id === pendingEnterId) li.classList.add("entering");

      li.draggable = true;
      li.ondragstart = ev => {
        draggedItemId = it._id;
        li.classList.add("dragging");
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", it._id);
      };
      li.ondragend = () => {
        li.classList.remove("dragging");
        list.querySelectorAll(".drag-over-top, .drag-over-bottom")
          .forEach(el => el.classList.remove("drag-over-top", "drag-over-bottom"));
        draggedItemId = null;
      };
      li.ondragover = ev => {
        if (!draggedItemId || draggedItemId === it._id) return;
        ev.preventDefault();
        const rect = li.getBoundingClientRect();
        const before = (ev.clientY - rect.top) < rect.height / 2;
        li.classList.toggle("drag-over-top", before);
        li.classList.toggle("drag-over-bottom", !before);
      };
      li.ondragleave = () => li.classList.remove("drag-over-top", "drag-over-bottom");
      li.ondrop = ev => {
        ev.preventDefault();
        li.classList.remove("drag-over-top", "drag-over-bottom");
        if (!draggedItemId || draggedItemId === it._id) return;
        const rect = li.getBoundingClientRect();
        const before = (ev.clientY - rect.top) < rect.height / 2;
        reorderItem(draggedItemId, it._id, before);
      };

      const dragHandle = document.createElement("div");
      dragHandle.className = "drag-handle";
      dragHandle.textContent = "⠿";
      dragHandle.title = "Drag to reorder";

      const box = document.createElement("div");
      box.className = "box";
      box.onclick = () => {
        playCheckSound();
        li.classList.add("leaving");
        li.addEventListener("animationend", () => {
          items[i].done = true;
          items[i].completedAt = new Date().toISOString();
          if (items[i].repeat && items[i].due) {
            items[i].due = nextOccurrence(items[i].due, items[i].repeat);
            items[i].done = false;
            items[i].completedAt = null;
            items[i].notified = false;
            pendingEnterId = items[i]._id;
          }
          save(); renderList();
        }, { once: true });
      };

      const txtWrap = document.createElement("div");
      txtWrap.className = "txt-wrap";

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = it.text;
      txt.title = "Double-click to edit";
      txt.ondblclick = () => edit(i, txt);
      txtWrap.appendChild(txt);

      if (it.due) {
        const overdue = new Date(it.due).getTime() <= Date.now();
        const due = document.createElement("div");
        due.className = "due" + (overdue ? " overdue" : "");
        due.textContent = (overdue ? "Overdue • " : "") + formatDue(it.due) +
          (it.repeat ? " · ↻ " + repeatLabel(it.repeat) : "");
        due.title = "Click to change due date/time";
        due.onclick = () => toggleDueEdit(i, txtWrap);
        txtWrap.appendChild(due);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const pinBtn = document.createElement("button");
      pinBtn.className = "pin-btn" + (it.pinned ? " pinned" : "");
      pinBtn.textContent = "📌";
      pinBtn.title = it.pinned ? "Unpin" : "Pin to top";
      pinBtn.onclick = () => { items[i].pinned = !items[i].pinned; save(); renderList(); };

      const dueBtn = document.createElement("button");
      dueBtn.className = "due-btn";
      dueBtn.textContent = "🕐";
      dueBtn.title = it.due ? "Change due date/time" : "Add due date/time";
      dueBtn.onclick = () => toggleDueEdit(i, txtWrap);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete";
      del.onclick = () => { items.splice(i, 1); save(); renderList(); };

      actions.append(pinBtn, dueBtn, del);
      li.append(dragHandle, box, txtWrap, actions);
      list.appendChild(li);
    });
    pendingEnterId = null;

    const done = items.filter(x => x.done).length;
    const left = items.length - done;
    document.getElementById("count").textContent = items.length ? `${left} left` : "";
  }

  function renderCompletedList() {
    const al = activeList();
    const items = al.items;
    list.innerHTML = "";

    const order = items.map((_, i) => i)
      .filter(i => items[i].done)
      .sort((a, b) => new Date(b && items[b].completedAt || 0) - new Date(a && items[a].completedAt || 0));

    if (!order.length) {
      list.innerHTML = '<div class="empty">No completed tasks yet.</div>';
    }

    order.forEach(i => {
      const it = items[i];
      const li = document.createElement("li");
      li.className = "done";

      const box = document.createElement("div");
      box.className = "box";
      box.title = "Mark as not done";
      box.onclick = () => {
        items[i].done = false;
        items[i].completedAt = null;
        save(); renderList();
      };

      const txtWrap = document.createElement("div");
      txtWrap.className = "txt-wrap";

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = it.text;
      txtWrap.appendChild(txt);

      if (it.completedAt) {
        const completed = document.createElement("div");
        completed.className = "completed-at";
        completed.textContent = "Completed " + formatDue(it.completedAt);
        txtWrap.appendChild(completed);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const restoreBtn = document.createElement("button");
      restoreBtn.className = "restore-btn";
      restoreBtn.textContent = "↩";
      restoreBtn.title = "Restore to active list";
      restoreBtn.onclick = () => {
        items[i].done = false;
        items[i].completedAt = null;
        save(); renderList();
      };

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete permanently";
      del.onclick = () => { items.splice(i, 1); save(); renderList(); };

      actions.append(restoreBtn, del);
      li.append(box, txtWrap, actions);
      list.appendChild(li);
    });

    document.getElementById("count").textContent = order.length ? `${order.length} completed` : "";
  }

  function renderSettingsView() {
    list.innerHTML = "";
    document.getElementById("count").textContent = "";

    const view = document.createElement("div");
    view.className = "settings-view";

    const row = document.createElement("div");
    row.className = "settings-row";

    const label = document.createElement("label");
    label.htmlFor = "retentionSelect";
    label.textContent = "Clear completed tasks";

    const select = document.createElement("select");
    select.id = "retentionSelect";
    [
      ["endOfDay", "At the end of each day"],
      ["1h", "After 1 hour"],
      ["6h", "After 6 hours"],
      ["24h", "After 24 hours"],
      ["never", "Never (manual only)"],
    ].forEach(([value, text]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = text;
      if (state.settings.retention === value) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = () => {
      state.settings.retention = select.value;
      save();
      purgeExpiredCompleted();
    };

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Completed tasks stay in the Completed tab until this runs, then they're gone for good.";

    row.append(label, select, hint);

    const vibrancyRow = document.createElement("div");
    vibrancyRow.className = "settings-row";

    const vibrancyHeader = document.createElement("div");
    vibrancyHeader.className = "settings-switch-row";

    const vibrancyLabel = document.createElement("label");
    vibrancyLabel.htmlFor = "vibrancyToggle";
    vibrancyLabel.textContent = "Translucent background";

    const switchLabel = document.createElement("label");
    switchLabel.className = "switch";
    const vibrancyToggle = document.createElement("input");
    vibrancyToggle.type = "checkbox";
    vibrancyToggle.id = "vibrancyToggle";
    vibrancyToggle.checked = !!state.settings.vibrancy;
    const switchTrack = document.createElement("span");
    switchTrack.className = "switch-track";
    switchLabel.append(vibrancyToggle, switchTrack);

    vibrancyToggle.onchange = () => {
      state.settings.vibrancy = vibrancyToggle.checked;
      save();
      applyVibrancy(state.settings.vibrancy);
    };

    vibrancyHeader.append(vibrancyLabel, switchLabel);

    const vibrancyHint = document.createElement("div");
    vibrancyHint.className = "hint";
    vibrancyHint.textContent = "Frosted, see-through background like Control Center.";

    vibrancyRow.append(vibrancyHeader, vibrancyHint);

    view.append(row, vibrancyRow);
    list.appendChild(view);
  }

  function applyVibrancy(enabled) {
    document.body.classList.toggle("vibrancy", !!enabled);
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.set_vibrancy(!!enabled);
    }
  }

  // ---- Calendar view (day / agenda / month, picked in Settings) ----

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  // Due, not-yet-done tasks across every list, each paired with its list
  // (for color + name) — the calendar looks across all lists, not just
  // the active one, since due dates matter regardless of which list.
  function collectDueTasks() {
    const result = [];
    state.lists.forEach(l => {
      l.items.forEach(it => {
        if (it.due && !it.done) result.push({ item: it, list: l });
      });
    });
    result.sort((a, b) => new Date(a.item.due) - new Date(b.item.due));
    return result;
  }

  function completeDueTask(entry) {
    playCheckSound();
    entry.item.done = true;
    entry.item.completedAt = new Date().toISOString();
    if (entry.item.repeat && entry.item.due) {
      entry.item.due = nextOccurrence(entry.item.due, entry.item.repeat);
      entry.item.done = false;
      entry.item.completedAt = null;
    }
    save();
    renderList();
  }

  function buildCalChip(entry, opts) {
    opts = opts || {};
    const { item, list } = entry;
    const overdue = new Date(item.due).getTime() <= Date.now();
    const chip = document.createElement("div");
    chip.className = "cal-chip" + (overdue ? " overdue" : "");
    if (list.color) chip.style.setProperty("--tab-color", list.color);

    const box = document.createElement("div");
    box.className = "box";
    box.title = "Mark as done";
    box.onclick = ev => { ev.stopPropagation(); completeDueTask(entry); };

    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = item.text;

    chip.append(box, txt);

    if (opts.showList && state.lists.length > 1) {
      const listname = document.createElement("div");
      listname.className = "listname";
      listname.textContent = list.name;
      chip.appendChild(listname);
    }

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = (overdue ? "Overdue · " : "") + (opts.timeText || formatDue(item.due));
    chip.appendChild(time);

    return chip;
  }

  function renderCalendarView() {
    document.getElementById("count").textContent = "";
    const style = state.settings.calendarView;
    if (style === "agenda") renderCalendarAgenda();
    else if (style === "month") renderCalendarMonth();
    else renderCalendarDay();
  }

  function renderCalendarDay() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const today = new Date();
    const isToday = sameDay(calendarDate, today);

    const nav = document.createElement("div");
    nav.className = "daynav";
    const prev = document.createElement("button");
    prev.type = "button";
    prev.textContent = "‹";
    prev.onclick = () => { calendarDate.setDate(calendarDate.getDate() - 1); renderList(); };
    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "›";
    next.onclick = () => { calendarDate.setDate(calendarDate.getDate() + 1); renderList(); };
    const label = document.createElement("div");
    label.className = "label";
    label.title = "Jump to today";
    const main = document.createElement("div");
    main.textContent = isToday ? "Today" : calendarDate.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = calendarDate.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    label.append(main, sub);
    label.onclick = () => { calendarDate = new Date(); renderList(); };
    nav.append(prev, label, next);
    view.appendChild(nav);

    const dueToday = collectDueTasks().filter(e => sameDay(new Date(e.item.due), calendarDate));

    const grid = document.createElement("div");
    grid.className = "hourgrid";
    for (let h = 0; h < 24; h++) {
      const row = document.createElement("div");
      row.className = "hour-row";
      const hourLabel = document.createElement("div");
      hourLabel.className = "hourlabel";
      hourLabel.textContent = new Date(2000, 0, 1, h).toLocaleTimeString(undefined, { hour: "numeric" });
      const slot = document.createElement("div");
      slot.className = "slot";
      dueToday.filter(e => new Date(e.item.due).getHours() === h).forEach(e => {
        const overdue = new Date(e.item.due).getTime() <= Date.now();
        const block = document.createElement("div");
        block.className = "task-block" + (overdue ? " overdue" : "");
        if (e.list.color) block.style.setProperty("--tab-color", e.list.color);
        block.onclick = () => completeDueTask(e);
        block.append(e.item.text);
        const t = document.createElement("span");
        t.className = "t";
        t.textContent = formatDue(e.item.due) + (state.lists.length > 1 ? " · " + e.list.name : "");
        block.appendChild(t);
        slot.appendChild(block);
      });
      row.append(hourLabel, slot);
      grid.appendChild(row);
    }
    view.appendChild(grid);
    list.appendChild(view);

    requestAnimationFrame(() => {
      const targetHour = isToday ? today.getHours() : (dueToday[0] ? new Date(dueToday[0].item.due).getHours() : 8);
      const rows = grid.querySelectorAll(".hour-row");
      if (rows[targetHour]) list.scrollTop = Math.max(0, rows[targetHour].offsetTop - 30);
    });
  }

  function agendaTimeText(iso, groupKey) {
    const d = new Date(iso);
    if (groupKey === "today" || groupKey === "tomorrow") {
      return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }
    if (groupKey === "week") return d.toLocaleDateString(undefined, { weekday: "short" });
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function renderCalendarAgenda() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const due = collectDueTasks();
    const now = new Date();
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const tomorrow0 = new Date(today0); tomorrow0.setDate(tomorrow0.getDate() + 1);
    const afterTomorrow0 = new Date(today0); afterTomorrow0.setDate(afterTomorrow0.getDate() + 2);
    const weekEnd0 = new Date(today0); weekEnd0.setDate(weekEnd0.getDate() + 7);

    const groups = { today: [], tomorrow: [], week: [], later: [] };
    due.forEach(e => {
      const d = new Date(e.item.due);
      if (d < tomorrow0) groups.today.push(e);
      else if (d < afterTomorrow0) groups.tomorrow.push(e);
      else if (d < weekEnd0) groups.week.push(e);
      else groups.later.push(e);
    });

    const GROUP_LABELS = { today: "Today", tomorrow: "Tomorrow", week: "This week", later: "Later" };
    let any = false;
    ["today", "tomorrow", "week", "later"].forEach(key => {
      const items = groups[key];
      if (!items.length) return;
      any = true;
      const g = document.createElement("div");
      g.className = "agenda-group";
      const heading = document.createElement("div");
      heading.className = "agenda-heading";
      heading.append(GROUP_LABELS[key]);
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = items.length;
      heading.appendChild(n);
      g.appendChild(heading);
      const listWrap = document.createElement("div");
      listWrap.className = "cal-list";
      items.forEach(e => {
        listWrap.appendChild(buildCalChip(e, { timeText: agendaTimeText(e.item.due, key), showList: true }));
      });
      g.appendChild(listWrap);
      view.appendChild(g);
    });

    if (!any) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No upcoming due tasks.";
      view.appendChild(empty);
    }

    list.appendChild(view);
  }

  function renderCalendarMonth() {
    list.innerHTML = "";
    const view = document.createElement("div");
    view.className = "cal-view";

    const due = collectDueTasks();
    const dueDates = new Set(due.map(e => {
      const d = new Date(e.item.due);
      return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    }));

    const nav = document.createElement("div");
    nav.className = "cal-nav";
    const prev = document.createElement("button");
    prev.type = "button";
    prev.textContent = "‹";
    prev.onclick = () => { calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1); renderList(); };
    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "›";
    next.onclick = () => { calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1); renderList(); };
    const monthLabel = document.createElement("div");
    monthLabel.className = "month";
    monthLabel.textContent = calendarDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    nav.append(prev, monthLabel, next);
    view.appendChild(nav);

    const grid = document.createElement("div");
    grid.className = "cal-grid";
    ["S", "M", "T", "W", "T", "F", "S"].forEach(d => {
      const dow = document.createElement("div");
      dow.className = "dow";
      dow.textContent = d;
      grid.appendChild(dow);
    });

    const firstOfMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
    const gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - firstOfMonth.getDay());

    const today = new Date();
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const inMonth = d.getMonth() === calendarDate.getMonth();
      const dayBtn = document.createElement("button");
      dayBtn.type = "button";
      dayBtn.className = "cal-day"
        + (inMonth ? "" : " muted")
        + (sameDay(d, today) ? " today" : "")
        + (!sameDay(d, today) && sameDay(d, calendarDate) ? " selected" : "");
      dayBtn.append(String(d.getDate()));
      if (dueDates.has(d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate())) {
        const mark = document.createElement("span");
        mark.className = "mark";
        dayBtn.appendChild(mark);
      }
      dayBtn.onclick = () => { calendarDate = d; renderList(); };
      grid.appendChild(dayBtn);
    }
    view.appendChild(grid);

    const daytasks = document.createElement("div");
    daytasks.className = "cal-daytasks";
    const heading = document.createElement("div");
    heading.className = "heading";
    heading.textContent = sameDay(calendarDate, today)
      ? "Today"
      : calendarDate.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    daytasks.appendChild(heading);

    const dayTasks = due.filter(e => sameDay(new Date(e.item.due), calendarDate));
    const listWrap = document.createElement("div");
    listWrap.className = "cal-list";
    if (!dayTasks.length) {
      const empty = document.createElement("div");
      empty.className = "hint";
      empty.textContent = "Nothing due this day.";
      listWrap.appendChild(empty);
    } else {
      dayTasks.forEach(e => listWrap.appendChild(buildCalChip(e, { showList: true })));
    }
    daytasks.appendChild(listWrap);
    view.appendChild(daytasks);

    list.appendChild(view);
  }

  function toggleDueEdit(i, container) {
    const existing = container.querySelector(".due-edit");
    if (existing) { existing.remove(); return; }

    const items = activeList().items;
    const wrap = document.createElement("div");
    wrap.className = "due-edit";

    const row = document.createElement("div");
    row.className = "due-edit-row";

    const calBtn = document.createElement("button");
    calBtn.type = "button";
    calBtn.className = "cal-btn";
    calBtn.textContent = "📅";
    calBtn.title = "Pick a date";

    const dateInp = document.createElement("input");
    dateInp.type = "date";

    const hourInp = document.createElement("input");
    hourInp.type = "number";
    hourInp.min = "1";
    hourInp.max = "12";
    hourInp.className = "time-num";
    hourInp.title = "Hour";

    const minuteInp = document.createElement("input");
    minuteInp.type = "number";
    minuteInp.min = "0";
    minuteInp.max = "59";
    minuteInp.className = "time-num";
    minuteInp.title = "Minute";

    const ampmSelect = document.createElement("select");
    ampmSelect.className = "ampm-select";
    ["AM", "PM"].forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      ampmSelect.appendChild(opt);
    });

    function setTimeFields(hhmm) {
      const { hour, minute, ampm } = to12Hour(hhmm);
      hourInp.value = hour;
      minuteInp.value = String(minute).padStart(2, "0");
      ampmSelect.value = ampm;
    }
    function getTimeValue() {
      const h = Math.min(12, Math.max(1, Number(hourInp.value) || 12));
      const m = Math.min(59, Math.max(0, Number(minuteInp.value) || 0));
      return to24HourValue(h, m, ampmSelect.value);
    }

    calBtn.onclick = () => {
      if (typeof dateInp.showPicker === "function") dateInp.showPicker();
      else dateInp.focus();
    };

    if (items[i].due) {
      dateInp.value = toDateInputValue(items[i].due);
      setTimeFields(toTimeInputValue(items[i].due));
    } else {
      setTimeFields("09:00");
    }

    const commitDue = () => {
      if (!dateInp.value) return;
      items[i].due = new Date(`${dateInp.value}T${getTimeValue()}`).toISOString();
      items[i].notified = false;
      save(); renderList();
    };
    dateInp.onchange = commitDue;
    hourInp.onchange = commitDue;
    minuteInp.onchange = commitDue;
    ampmSelect.onchange = commitDue;

    const clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "Clear";
    clearBtn.onclick = () => {
      items[i].due = null;
      items[i].notified = false;
      items[i].repeat = null;
      save(); renderList();
    };

    row.append(calBtn, dateInp, hourInp, minuteInp, ampmSelect, clearBtn);

    const repeatSelect = document.createElement("select");
    [["", "Doesn't repeat"], ["daily", "Repeats daily"], ["weekly", "Repeats weekly"], ["monthly", "Repeats monthly"]]
      .forEach(([value, label]) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        if ((items[i].repeat || "") === value) opt.selected = true;
        repeatSelect.appendChild(opt);
      });
    repeatSelect.onchange = () => {
      items[i].repeat = repeatSelect.value || null;
      save(); renderList();
    };

    wrap.append(row, repeatSelect);
    container.appendChild(wrap);
    dateInp.focus();
  }

  function edit(i, el) {
    const items = activeList().items;
    const inp = document.createElement("input");
    inp.value = items[i].text;
    inp.style.cssText = "flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:6px;color:var(--text);padding:4px 6px;font:inherit;outline:none";
    el.replaceWith(inp);
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    const commit = () => {
      const v = inp.value.trim();
      if (v) items[i].text = v; else items.splice(i, 1);
      save(); renderList();
    };
    inp.onblur = commit;
    inp.onkeydown = e => {
      if (e.key === "Enter") inp.blur();
      if (e.key === "Escape") { inp.onblur = null; renderList(); }
    };
  }

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    const newItem = {
      _id: uid(), text: v, done: false, due: null, notified: false,
      pinned: false, repeat: null, completedAt: null,
    };
    activeList().items.unshift(newItem);
    pendingEnterId = newItem._id;
    input.value = "";
    playPopSound();
    save(); renderList();
  };

  const backBtn = document.getElementById("backBtn");
  const calStyleBtn = document.getElementById("calStyleBtn");
  const calendarBtn = document.getElementById("calendarBtn");
  const archiveBtn = document.getElementById("archiveBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const tabsContainer = document.getElementById("tabs");
  const addForm = document.getElementById("form");

  function setViewMode(mode) {
    viewMode = viewMode === mode ? "active" : mode;
    backBtn.hidden = viewMode === "active";
    calStyleBtn.hidden = viewMode !== "calendar";
    calendarBtn.classList.toggle("active", viewMode === "calendar");
    archiveBtn.classList.toggle("active", viewMode === "completed");
    settingsBtn.classList.toggle("active", viewMode === "settings");
    addForm.hidden = viewMode !== "active";
    tabsContainer.hidden = viewMode !== "active";
    renderList();
  }

  backBtn.onclick = () => setViewMode("active");
  calendarBtn.onclick = () => setViewMode("calendar");
  archiveBtn.onclick = () => setViewMode("completed");
  settingsBtn.onclick = () => setViewMode("settings");

  const CALENDAR_STYLES = [
    ["day", "Day view (hour grid)"],
    ["agenda", "Agenda list"],
    ["month", "Mini month calendar"],
  ];

  calStyleBtn.onclick = ev => {
    closeTabMenu();
    const menu = document.createElement("div");
    menu.className = "tab-menu";
    menu.onclick = e => e.stopPropagation();

    CALENDAR_STYLES.forEach(([value, text]) => {
      const item = document.createElement("button");
      item.className = "tab-menu-item";
      item.textContent = (state.settings.calendarView === value ? "✓ " : "　 ") + text;
      item.onclick = () => {
        state.settings.calendarView = value;
        save();
        closeTabMenu();
        renderList();
      };
      menu.appendChild(item);
    });

    document.body.appendChild(menu);
    const rect = calStyleBtn.getBoundingClientRect();
    const menuWidth = menu.offsetWidth;
    const maxX = window.innerWidth - menuWidth - 8;
    menu.style.left = Math.max(8, Math.min(rect.left, maxX)) + "px";
    menu.style.top = (rect.bottom + 6) + "px";

    tabMenuCloser = closeTabMenu;
    document.addEventListener("click", tabMenuCloser);
    ev.stopPropagation();
  };

  // Called periodically from Python (even while the window is hidden in the
  // tray) to find due tasks and hand back native-notification payloads.
  window.__checkDueTasks = function () {
    const now = Date.now();
    const dueNow = [];
    state.lists.forEach(l => {
      l.items.forEach(it => {
        if (it.due && !it.done && !it.notified && new Date(it.due).getTime() <= now) {
          it.notified = true;
          dueNow.push({ list: l.name, text: it.text });
        }
      });
    });
    if (dueNow.length) {
      save();
      // Don't yank an in-progress edit out from under the user — the next
      // render (tab switch, add, toggle, etc.) will pick up the change.
      if (!document.querySelector(".due-edit")) renderList();
    }
    return JSON.stringify(dueNow);
  };

  purgeExpiredCompleted();
  setInterval(purgeExpiredCompleted, 60 * 1000);

  renderTabs();
  renderList();

  // window.pywebview.api isn't ready until "pywebviewready" fires, but
  // relying on that event alone was flaky on relaunch — if it fires
  // before this listener attaches (a real race, not just theoretical),
  // vibrancy silently never gets (re)applied for that whole session.
  // Poll as a guaranteed fallback alongside the event.
  window.addEventListener("pywebviewready", () => applyVibrancy(state.settings.vibrancy), { once: true });
  (function ensureVibrancyApplied() {
    if (!state.settings.vibrancy) return;
    if (window.pywebview && window.pywebview.api) {
      applyVibrancy(true);
    } else {
      setTimeout(ensureVibrancyApplied, 200);
    }
  })();

  // Same "poll until the bridge exists" approach as vibrancy above —
  // check the Python-side backup once the API is ready, and recover
  // from it if it turns out to have more tasks than localStorage did.
  (function checkBackupWhenReady() {
    if (window.pywebview && window.pywebview.api) {
      recoverFromBackupIfNewer();
    } else {
      setTimeout(checkBackupWhenReady, 200);
    }
  })();
</script>
