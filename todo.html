<meta charset="utf-8">
<title>List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2b2f38;
    --text: #e7e9ee;
    --muted: #8b909c;
    --accent: #6ea8fe;
    --done: #565b66;
    --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e7e9ee;
      --text: #1c1e24;
      --muted: #8b909c;
      --accent: #2f6fed;
      --done: #b3b7c0;
      --danger: #e0483d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: flex-start;
    -webkit-user-select: none;
    user-select: none;
  }
  body.vibrancy { background: rgba(22, 24, 29, 0.9); }
  @media (prefers-color-scheme: light) {
    body.vibrancy { background: rgba(246, 247, 249, 0.9); }
  }
  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    /* left padding clears the traffic-light buttons, which float directly
       over the content now that the titlebar is transparent — top padding
       is kept tight so this row reads as part of that same corner instead
       of a separate bar floating below it */
    padding: 16px 24px 10px 72px;
  }
  header .count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 4px 6px;
    line-height: 1;
    flex: none;
  }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn.active { color: var(--accent); }

  .settings-view { padding: 8px 20px; }
  .settings-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .settings-row label { font-size: 14px; font-weight: 500; }
  .settings-row .hint { font-size: 12px; color: var(--muted); }
  .settings-row select {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    outline: none;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    .settings-row select { color-scheme: light; }
  }
  .settings-switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 24px;
    flex: none;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    background: var(--line);
    border-radius: 24px;
    cursor: pointer;
    transition: background .15s;
  }
  .switch-track::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s;
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::before { transform: translateX(16px); }

  /* ---- calendar: shared ---- */
  .cal-view { padding: 4px 14px 14px; }
  .cal-chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid var(--tab-color, var(--line));
    cursor: pointer;
  }
  .cal-chip .box {
    width: 15px; height: 15px;
    border: 2px solid var(--muted);
    border-radius: 5px;
    flex: none;
    cursor: pointer;
  }
  .cal-chip .txt { font-size: 12.5px; flex: 1; min-width: 0; word-break: break-word; }
  .cal-chip .listname { font-size: 10.5px; color: var(--muted); }
  .cal-chip .time {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex: none;
    white-space: nowrap;
  }
  .cal-chip.overdue .time { color: var(--danger); }

  /* ---- calendar: day view ---- */
  .daynav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .daynav button {
    background: none; border: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 2px 10px;
  }
  .daynav button:hover { color: var(--accent); }
  .daynav .label { font-size: 13.5px; font-weight: 600; text-align: center; cursor: pointer; }
  .daynav .label .sub { color: var(--muted); font-weight: 400; font-size: 11px; display: block; }
  .hour-row {
    display: flex;
    gap: 10px;
    min-height: 44px;
    border-top: 1px solid var(--line);
    padding-top: 5px;
  }
  .hour-row .hourlabel {
    width: 42px;
    flex: none;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  .hour-row .slot { flex: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 5px; min-width: 0; }
  .task-block {
    background: color-mix(in srgb, var(--tab-color, var(--accent)) 22%, var(--panel));
    border-left: 3px solid var(--tab-color, var(--accent));
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11.5px;
    line-height: 1.3;
    cursor: pointer;
  }
  .task-block.overdue { border-left-color: var(--danger); }
  .task-block .t { font-size: 10px; color: var(--muted); display: block; margin-top: 1px; }

  /* ---- calendar: month view ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }
  .cal-nav button {
    background: none; border: none; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 2px 10px;
  }
  .cal-nav button:hover { color: var(--accent); }
  .cal-nav .month { font-size: 14px; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 10px;
  }
  .cal-grid .dow {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text);
    background: none;
    border: none;
    position: relative;
    cursor: pointer;
    font: inherit;
  }
  .cal-day:hover { background: var(--panel); }
  .cal-day.muted { color: var(--done); }
  .cal-day.today { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.selected:not(.today) { border: 1.5px solid var(--accent); }
  .cal-day .mark {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    position: absolute;
    bottom: 4px;
  }
  .cal-day.today .mark { background: #fff; }
  .cal-daytasks { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; }
  .cal-daytasks .heading { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
  .cal-list { display: flex; flex-direction: column; gap: 6px; }

  /* ---- calendar: agenda view ---- */
  .agenda-group { margin-top: 16px; }
  .agenda-group:first-child { margin-top: 4px; }
  .agenda-heading {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .agenda-heading .n {
    background: var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 600;
  }

  .completed-at {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .trash-meta {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  li.trash-row { align-items: center; }
  .trash-empty-row {
    display: flex;
    justify-content: flex-end;
    padding: 4px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .trash-empty-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--danger);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 10px;
  }
  .trash-empty-btn:hover { border-color: var(--danger); }
  .restore-btn {
    opacity: 0;
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 13px;
    flex: none;
  }
  li:hover .restore-btn { opacity: 1; }
  .restore-btn:hover { color: var(--accent); }

  .tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px 10px;
    overflow-x: auto;
    flex: none;
  }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    flex: none;
    border: 1px solid transparent;
  }
  .tab:hover { background: var(--panel); }
  .tab.active {
    background: var(--tab-color, var(--accent));
    color: #fff;
  }
  .tab .tab-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex: none;
    background: var(--tab-color, var(--muted));
  }
  .tab.active .tab-dot { display: none; }
  .tab .tab-x {
    opacity: 0;
    font-size: 14px;
    line-height: 1;
    padding: 0 1px;
  }
  .tab:hover .tab-x { opacity: .7; }
  .tab .tab-x:hover { opacity: 1 !important; color: #fff; }
  .tab.dragging { opacity: .35; }
  .tab.drag-over-left { box-shadow: inset 2px 0 0 0 var(--accent); }
  .tab.drag-over-right { box-shadow: inset -2px 0 0 0 var(--accent); }

  .tab-menu {
    position: fixed;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    width: 190px;
  }
  .tab-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab-menu-item:hover { background: var(--bg); }
  .tab-menu-item.danger { color: var(--danger); }
  .tab-menu-label {
    font-size: 11px;
    color: var(--muted);
    padding: 6px 8px 2px;
  }
  .tab-menu-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 8px 6px;
  }
  .tab-menu-swatch {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex: none;
  }
  .tab-menu-swatch.selected { border-color: var(--text); }
  .tab-menu-wheel-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 8px 3px 6px;
    border-radius: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    flex: none;
  }
  .tab-menu-wheel-label:hover { color: var(--accent); border-color: var(--accent); }
  .tab-menu-wheel {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid var(--line);
    padding: 0;
    cursor: pointer;
    flex: none;
    overflow: hidden;
  }
  .tab-menu-wheel::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .tab-menu-wheel::-webkit-color-swatch { border: none; border-radius: 50%; }
  .tab-menu-sep { border-top: 1px solid var(--line); margin: 4px 0; }
  .tab-add {
    flex: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px dashed var(--line);
    color: var(--muted);
    background: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); }
  .tab-name-input {
    border: none;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    width: 90px;
  }

  .tab.drag-over-group { box-shadow: inset 0 0 0 2px var(--accent); }

  .island {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 4px 6px 6px;
    border-radius: 14px;
    border: 1px solid var(--island-color, var(--line));
    background: color-mix(in srgb, var(--island-color, var(--line)) 10%, transparent);
    flex: none;
  }
  .island-label {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--island-color, var(--muted));
    cursor: pointer;
    user-select: none;
  }
  .island-chevron { font-size: 9px; flex: none; }
  .island-name { font-weight: 600; white-space: nowrap; }
  .island-body { display: flex; align-items: center; gap: 6px; }
  .island-pill {
    border: 1px solid var(--island-color, var(--line));
    background: color-mix(in srgb, var(--island-color, var(--line)) 14%, var(--panel));
  }
  .island-pill.drag-over-group { box-shadow: inset 0 0 0 2px var(--accent); }
  .island-pill.active-member { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .add {
    display: flex;
    gap: 8px;
    padding: 10px 20px 14px;
    border-top: 1px solid var(--line);
    flex: none;
  }
  /* the [hidden] attribute alone can't win against a plain-class display
     rule of equal specificity, so pair it with the class explicitly */
  .add[hidden], .tabs[hidden] { display: none; }
  .add input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    padding: 11px 13px;
    font-size: 15px;
    outline: none;
  }
  .add input:focus { border-color: var(--accent); }
  .add button {
    background: var(--accent);
    border: none;
    border-radius: 9px;
    color: #fff;
    width: 44px;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .add button:active { transform: scale(.96); }
  .add-type-toggle {
    flex: none;
    width: 36px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
  }
  .add-type-toggle.note-mode { color: var(--accent); border-color: var(--accent); }
  .add-type-toggle:active { transform: scale(.96); }
  ul { list-style: none; overflow-y: auto; flex: 1; padding: 0 12px 16px; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 9px;
  }
  li:hover { background: var(--panel); }
  @keyframes item-enter {
    from { transform: translateX(-26px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes item-leave {
    to { transform: translateX(140%); opacity: 0; }
  }
  li.entering { animation: item-enter .3s cubic-bezier(.2,.8,.2,1); }
  li.leaving {
    animation: item-leave .32s cubic-bezier(.4,0,.6,1) forwards;
    pointer-events: none;
  }
  li.dragging { opacity: .35; }
  li.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  li.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }
  li.drag-over-route { box-shadow: inset 0 0 0 2px var(--accent); background: var(--panel); }
  li.note-row .txt { font-style: italic; color: var(--muted); }
  li.note-row { border-left: 2px dashed var(--line); }
  li.subtask-row { padding-left: 34px; }
  .subtask-chevron {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 10px;
    padding: 4px 2px 4px 0;
    flex: none;
    align-self: flex-start;
  }
  .subtask-chevron:hover { color: var(--accent); }
  .note-indicator {
    opacity: 0;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    flex: none;
  }
  li:hover .note-indicator { opacity: 1; }
  .note-indicator.expanded { opacity: 1; color: var(--accent); }
  .note-indicator:hover { color: var(--accent); }
  .note-attached {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-top: 4px;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 7px;
  }
  .note-attached.dragging { opacity: .35; }
  .note-attached-text {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    color: var(--text);
    cursor: grab;
  }
  .note-attached-line {
    padding: 2px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .note-attached-line + .note-attached-line { border-top: 1px solid var(--line); }
  .note-attached-edit {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    padding: 4px 6px;
    resize: vertical;
    min-height: 40px;
  }
  .note-attached-actions {
    display: flex;
    gap: 2px;
    flex: none;
  }
  .note-attached-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    flex: none;
  }
  .note-attached:hover .note-attached-btn { opacity: 1; }
  .note-attached-btn:hover { color: var(--accent); }
  .note-attached-btn.delete:hover { color: var(--danger); }
  .drag-handle {
    opacity: 0;
    color: var(--muted);
    font-size: 14px;
    flex: none;
    padding-top: 2px;
    cursor: grab;
  }
  li:hover .drag-handle { opacity: 1; }
  .box {
    width: 20px; height: 20px;
    margin-top: 1px;
    border: 2px solid var(--muted);
    border-radius: 6px;
    flex: none;
    cursor: pointer;
    position: relative;
    transition: .12s;
  }
  .box:hover { border-color: var(--accent); }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box::after {
    content: "";
    position: absolute; left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .txt-wrap { flex: 1; min-width: 0; }
  .txt { cursor: text; word-break: break-word; padding-top: 1px; }
  li.done .txt { color: var(--done); text-decoration: line-through; }
  .due {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 3px;
    cursor: pointer;
    display: inline-block;
  }
  .due.overdue { color: var(--danger); }
  li.done .due { color: var(--done); }
  .row-actions {
    display: flex;
    align-items: center;
    flex: none;
    gap: 2px;
  }
  .pin-btn, .due-btn, .del {
    opacity: 0;
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    flex: none;
  }
  .pin-btn { font-size: 13px; }
  .due-btn { font-size: 14px; }
  .del { font-size: 18px; }
  li:hover .pin-btn, li:hover .due-btn, li:hover .del { opacity: 1; }
  .pin-btn.pinned { opacity: 1; color: var(--accent); }
  .pin-btn:hover { color: var(--accent); }
  .due-btn:hover { color: var(--accent); }
  .del:hover { color: var(--danger); }
  li.pinned-row { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .due-edit {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }
  .due-edit-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .due-edit-row[hidden] { display: none; }
  .due-edit-row input[type="date"] {
    flex: 1 1 auto;
    min-width: 118px;
  }
  .due-edit input, .due-edit select {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);

</style>

<div class="app">
  <header>
    <button id="backBtn" class="icon-btn" title="Back" hidden>←</button>
    <span class="count" id="count"></span>
    <button id="calStyleBtn" class="icon-btn" title="Calendar layout" hidden>⋯</button>
    <button id="sortBtn" class="icon-btn" title="Sort">⇅</button>
    <button id="calendarBtn" class="icon-btn" title="Calendar">📅</button>
    <button id="archiveBtn" class="icon-btn" title="Completed tasks">🗂️</button>
    <button id="trashBtn" class="icon-btn" title="Trash">🗑️</button>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <ul id="list"></ul>
  <form class="add" id="form">
    <button type="button" id="addTypeToggle" class="add-type-toggle" title="Adding a task — click to switch to a note">☑</button>
    <input id="input" placeholder="Add a task…" autocomplete="off" autofocus>
    <button type="submit" title="Add">+</button>
  </form>
</div>

<script>
  const KEY = "todo.widget.v3";
  const OLD_KEY_V2 = "todo.widget.v2";
  const OLD_KEY_V1 = "todo.widget.v1";

  const LIST_COLORS = [
    "#6ea8fe", "#ff6b6b", "#ffa94d", "#ffd43b",
    "#69db7c", "#38d9a9", "#66d9e8", "#b197fc", "#f783ac",
  ];

  let state = load();

  const TRACKED_ITEM_FIELDS = ["text", "done", "due", "dueAllDay", "pinned", "repeat", "repeatDays", "repeatWeekday", "repeatOccurrence"];

  function snapshotItemFields(s) {
    const map = new Map();
    (s.lists || []).forEach(l => {
      (l.items || []).forEach(it => {
        const fields = {};
        TRACKED_ITEM_FIELDS.forEach(k => { fields[k] = it[k]; });
        map.set(it._id, fields);
      });
    });
    return map;
  }

  function fieldsEqual(a, b) {
    return TRACKED_ITEM_FIELDS.every(k => a[k] === b[k]);
  }

  let lastItemFields = snapshotItemFields(state);

  function stampUpdatedAtAndTombstones() {
    const now = new Date().toISOString();
    const currentIds = new Set();
    state.lists.forEach(l => {
      l.items.forEach(it => {
        currentIds.add(it._id);
        const prev = lastItemFields.get(it._id);
        const cur = {};
        TRACKED_ITEM_FIELDS.forEach(k => { cur[k] = it[k]; });
        if (!prev || !fieldsEqual(prev, cur)) {
          it.updatedAt = now;
        }
      });
    });
    if (!Array.isArray(state.tombstones)) state.tombstones = [];
    const tombstoneIds = new Set(state.tombstones.map(t => t._id));
    lastItemFields.forEach((_, id) => {
      if (!currentIds.has(id) && !tombstoneIds.has(id)) {
        state.tombstones.push({ _id: id, updatedAt: now });
      }
    });
    lastItemFields = snapshotItemFields(state);
  }

  const tabsEl = document.getElementById("tabs");
  const list = document.getElementById("list");
  const input = document.getElementById("input");

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function normalizeItems(items) {
    (items || []).forEach(it => {
      if (it.due === undefined) it.due = null;
      if (it.dueAllDay === undefined) it.dueAllDay = false;
      if (it.notified === undefined) it.notified = false;
      if (it.pinned === undefined) it.pinned = false;
      if (it.repeat === undefined) it.repeat = null;
      if (it.repeatDays === undefined) it.repeatDays = null;
      if (it.repeatWeekday === undefined) it.repeatWeekday = null;
      if (it.repeatOccurrence === undefined) it.repeatOccurrence = null;
      if (it.completedAt === undefined) it.completedAt = null;
      if (it.updatedAt === undefined) it.updatedAt = new Date().toISOString();
      if (it.type === undefined) it.type = "task";
      if (it.note === undefined) it.note = null;
      if (it.parentId === undefined) it.parentId = null;
      if (it.subtasksCollapsed === undefined) it.subtasksCollapsed = false;
      if (!it._id) it._id = uid();
    });
    return items || [];
  }

  // id of the item that should play its "enter" animation on the next
  // renderList() call — set right before adding/re-inserting an item.
  let pendingEnterId = null;

  // id of the item currently being drag-reordered in the active list.
  let draggedItemId = null;

  // id of the task whose attached note is being drag-pulled back out into
  // a standalone note item. Distinct from draggedItemId since the dragged
  // element here (the expanded note-text row) isn't itself an items[] entry.
  let draggedAttachedFromId = null;

  function reorderItem(draggedId, targetId, insertBefore) {
    const items = activeList().items;
    const fromIdx = items.findIndex(x => x._id === draggedId);
    if (fromIdx === -1) return;
    const [moved] = items.splice(fromIdx, 1);
    let toIdx = items.findIndex(x => x._id === targetId);
    if (toIdx === -1) {
      items.push(moved);
    } else {
      items.splice(insertBefore ? toIdx : toIdx + 1, 0, moved);
    }
    save();
    renderList();
  }

  // Nests a task under another task (one level deep only). If the target
  // is itself a subtask, the dragged task becomes a sibling under the
  // target's parent instead of creating a second level of nesting.
  function nestTaskUnderTask(draggedId, targetId) {
    const items = activeList().items;
    const dragged = items.find(x => x._id === draggedId);
    const target = items.find(x => x._id === targetId);
    if (!dragged || !target || dragged._id === target._id) return;
    const newParentId = target.parentId || target._id;
    // Dragging a task onto its own subtask would make it its own parent -
    // a cycle. Guard against it rather than letting it corrupt the tree.
    if (newParentId === dragged._id) return;
    // A task can't both have subtasks of its own and be a subtask itself
    // (one level max) - promote its existing children to top-level first.
    items.forEach(x => { if (x.parentId === dragged._id) x.parentId = null; });
    dragged.parentId = newParentId;
    save();
    renderList();
  }

  // Moves a standalone note item's text onto a task's `note` field
  // (appending if the task already has one) and removes the note item.
  function routeNoteOntoTask(noteId, taskId) {
    const items = activeList().items;
    const noteIdx = items.findIndex(x => x._id === noteId);
    const task = items.find(x => x._id === taskId);
    if (noteIdx === -1 || !task) return;
    const note = items[noteIdx];
    task.note = task.note ? task.note + "\n" + note.text : note.text;
    items.splice(noteIdx, 1);
    save();
    renderList();
  }

  // Dropping a dragged attached-note handle in open list space (not onto
  // another task, which stopPropagation's before this ever runs) un-routes
  // it back into a standalone note item.
  list.ondragover = ev => { if (draggedAttachedFromId || draggedItemId) ev.preventDefault(); };
  list.ondrop = ev => {
    ev.preventDefault();
    if (draggedAttachedFromId) {
      const items = activeList().items;
      const task = items.find(x => x._id === draggedAttachedFromId);
      draggedAttachedFromId = null;
      if (!task || !task.note) return;
      items.push({ _id: uid(), type: "note", text: task.note });
      task.note = null;
      save();
      renderList();
      return;
    }
    // Dropping a dragged subtask in open list space (not onto another
    // item, which stopPropagation's before this ever runs) promotes it
    // back to a top-level task.
    if (draggedItemId) {
      const it = activeList().items.find(x => x._id === draggedItemId);
      if (it && it.parentId) {
        it.parentId = null;
        save();
        renderList();
      }
    }
  };

  // id of the list tab currently being drag-reordered.
  let draggedListId = null;

  function spliceListTo(draggedId, targetId, insertBefore) {
    const lists = state.lists;
    const fromIdx = lists.findIndex(x => x.id === draggedId);
    if (fromIdx === -1) return false;
    const [moved] = lists.splice(fromIdx, 1);
    const toIdx = lists.findIndex(x => x.id === targetId);
    if (toIdx === -1) {
      lists.push(moved);
    } else {
      lists.splice(insertBefore ? toIdx : toIdx + 1, 0, moved);
    }
    return true;
  }

  function reorderList(draggedId, targetId, insertBefore) {
    if (!spliceListTo(draggedId, targetId, insertBefore)) return;
    save();
    renderTabs();
  }

  // Islands group list tabs. Membership is kept contiguous in state.lists
  // by normalizeIslandContiguity() (called from save()), so island tabs
  // never end up split apart by an unrelated drag elsewhere in the strip.
  function nextIslandName() {
    const base = "Island";
    const existing = new Set(state.islands.map(x => x.name));
    if (!existing.has(base)) return base;
    let n = 2;
    while (existing.has(`${base} ${n}`)) n++;
    return `${base} ${n}`;
  }

  // Rebuilds state.lists so every island's members sit adjacent to each
  // other, at the position of that island's first-encountered member.
  // Idempotent when already contiguous; cheap enough to run on every save
  // given how small these lists are.
  function normalizeIslandContiguity() {
    if (!state.islands || !state.islands.length) return;
    const lists = state.lists;
    const seen = new Set();
    const result = [];
    lists.forEach(l => {
      if (l.islandId) {
        if (seen.has(l.islandId)) return;
        seen.add(l.islandId);
        result.push(...lists.filter(x => x.islandId === l.islandId));
      } else {
        result.push(l);
      }
    });
    state.lists = result;
  }

  // Rebuilds each list's items so every parent task is immediately
  // followed by all of its subtasks (in their existing relative order),
  // regardless of where the children currently sit in that list. Mirrors
  // normalizeIslandContiguity(), but per-list and keyed by parent identity
  // rather than a shared group id.
  function normalizeSubtaskContiguity() {
    state.lists.forEach(l => {
      const items = l.items;
      if (!items.some(it => it.parentId)) return;

      const childrenByParent = new Map();
      items.forEach(it => {
        if (!it.parentId) return;
        if (!childrenByParent.has(it.parentId)) childrenByParent.set(it.parentId, []);
        childrenByParent.get(it.parentId).push(it);
      });

      const placed = new Set();
      const result = [];
      items.forEach(it => {
        if (placed.has(it._id)) return;
        if (it.parentId) {
          // Orphaned subtask (its parent no longer exists) - keep it as a
          // standalone entry rather than dropping it.
          if (!items.some(x => x._id === it.parentId)) {
            placed.add(it._id);
            result.push(it);
          }
          return;
        }
        placed.add(it._id);
        result.push(it);
        const kids = childrenByParent.get(it._id);
        if (kids) kids.forEach(k => { if (!placed.has(k._id)) { placed.add(k._id); result.push(k); } });
      });
      l.items = result;
    });
  }

  // Dissolves an island once it has 1 or fewer members left, clearing
  // islandId on any remaining member so it becomes a standalone tab.
  function dissolveIslandIfSingleton(islandId) {
    const members = state.lists.filter(l => l.islandId === islandId);
    if (members.length <= 1) {
      members.forEach(l => { l.islandId = null; });
      state.islands = state.islands.filter(x => x.id !== islandId);
    }
  }

  function ungroupIsland(islandId) {
    state.lists.forEach(l => { if (l.islandId === islandId) l.islandId = null; });
    state.islands = state.islands.filter(x => x.id !== islandId);
    save(); renderTabs(); renderList();
  }

  // Forms/joins an island when a tab is dropped onto another tab's center
  // zone. Whichever side already belongs to an island absorbs the other;
  // if neither does, a brand-new island is created containing both.
  function groupTabs(draggedId, targetId) {
    const dragged = state.lists.find(x => x.id === draggedId);
    const target = state.lists.find(x => x.id === targetId);
    if (!dragged || !target) return;

    if (dragged.islandId && dragged.islandId === target.islandId) {
      reorderList(draggedId, targetId, true);
      return;
    }

    const prevIslandId = dragged.islandId;
    let islandId = target.islandId;
    if (!islandId) {
      islandId = uid();
      state.islands.push({ id: islandId, name: nextIslandName(), color: null, collapsed: false });
      target.islandId = islandId;
    }
    dragged.islandId = islandId;

    spliceListTo(draggedId, targetId, true);
    if (prevIslandId) dissolveIslandIfSingleton(prevIslandId);

    save();
    renderTabs();
    renderList();
  }

  // "active" shows open tasks; "completed" shows the current list's
  // finished tasks (still just a view over the same underlying data).
  let viewMode = "active";

  // The focused day in the calendar's day view, and the selected day in
  // its month view — reused across both since only one layout renders
  // at a time (picked in Settings).
  let calendarDate = new Date();

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // A warm, low-passed sine "thock" (with a sub-octave layer for body) —
  // a soft, buttery check sound rather than a bright digital blip.
  function playCheckSound() {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.3;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.19);
    filter.connect(gain).connect(ctx.destination);

    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t0);
    osc.frequency.exponentialRampToValueAtTime(180, t0 + 0.16);
    osc.connect(filter);
    osc.start(t0);
    osc.stop(t0 + 0.2);

    const sub = ctx.createOscillator();
    sub.type = "sine";
    sub.frequency.setValueAtTime(260, t0);
    sub.frequency.exponentialRampToValueAtTime(90, t0 + 0.16);
    sub.connect(filter);
    sub.start(t0);
    sub.stop(t0 + 0.2);
  }

  // Four soft, rounded "bubble" blips for adding a task — low-passed sine
  // waves with a gentle downward glide, warmer than a bright chirp.
  function playPopSound() {
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime;
    [460, 560, 660, 740].forEach((f, idx) => {
      const start = t0 + idx * 0.09;

      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 1400;
      filter.Q.value = 0.3;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      filter.connect(gain).connect(ctx.destination);

      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f * 1.6, start);
      osc.frequency.exponentialRampToValueAtTime(f, start + 0.05);
      osc.connect(filter);
      osc.start(start);
      osc.stop(start + 0.14);
    });
  }

  function load() {
    let result = null;

    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && Array.isArray(raw.lists) && raw.lists.length) result = raw;
    } catch {}

    if (!result) {
      try {
        const v2 = JSON.parse(localStorage.getItem(OLD_KEY_V2));
        if (v2 && Array.isArray(v2.lists) && v2.lists.length) result = v2;
      } catch {}
    }

    if (!result) {
      let migrated = [];
      try { migrated = JSON.parse(localStorage.getItem(OLD_KEY_V1)) || []; } catch {}
      const firstList = { id: uid(), name: "Tasks", items: Array.isArray(migrated) ? migrated : [] };
      result = { lists: [firstList], active: firstList.id };
    }

    result.lists.forEach(l => {
      normalizeItems(l.items);
      if (l.color === undefined) l.color = null;
      if (l.syncToVault === undefined) l.syncToVault = true;
      if (l.islandId === undefined) l.islandId = null;
    });
    if (!result.settings) result.settings = {};
    if (!result.settings.retention) result.settings.retention = "endOfDay";
    if (result.settings.vibrancy === undefined) result.settings.vibrancy = false;
    if (!result.settings.calendarView) result.settings.calendarView = "day";
    if (!result.settings.trashRetention) result.settings.trashRetention = "7d";
    if (!Array.isArray(result.tombstones)) result.tombstones = [];
    if (!Array.isArray(result.islands)) result.islands = [];
    if (!Array.isArray(result.trash)) result.trash = [];

    // One-time migration: the default first-list name changed from
    // "To-Do" to "Tasks". Only touch it once, so a list intentionally
    // renamed back to "To-Do" later doesn't get overwritten again.
    if (!result.migratedDefaultListName) {
      result.lists.forEach(l => { if (l.name === "To-Do") l.name = "Tasks"; });
      result.migratedDefaultListName = true;
    }

    return result;
  }

  function save() {
    normalizeIslandContiguity();
    normalizeSubtaskContiguity();
    stampUpdatedAtAndTombstones();
    const json = JSON.stringify(state);
    localStorage.setItem(KEY, json);
    // Belt-and-suspenders backup: written to a plain file with an
    // explicit fsync on the Python side, independent of whatever
    // WebKit's own (opaque, asynchronous) localStorage persistence is
    // doing. Fire-and-forget — don't block saves on it.
    if (window.pywebview && window.pywebview.api && window.pywebview.api.save_backup) {
      window.pywebview.api.save_backup(json).catch(() => {});
    }
  }

  function countAllItems(s) {
    return (s.lists || []).reduce((sum, l) => sum + (l.items || []).length, 0);
  }

  // If the Python-side backup has strictly more tasks than what we just
  // loaded from localStorage, localStorage lost data relative to the
  // last known-good backup — recover from the backup instead.
  function recoverFromBackupIfNewer() {
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.load_backup) return;
    window.pywebview.api.load_backup().then(raw => {
      if (!raw) return;
      let backup;
      try { backup = JSON.parse(raw); } catch { return; }
      if (!backup || !Array.isArray(backup.lists)) return;
      if (countAllItems(backup) > countAllItems(state)) {
        state = backup;
        state.lists.forEach(l => {
          normalizeItems(l.items);
          if (l.color === undefined) l.color = null;
        });
        if (!Array.isArray(state.tombstones)) state.tombstones = [];
        lastItemFields = snapshotItemFields(state);
        save();
        renderTabs();
        renderList();
      }
    }).catch(() => {});
  }

  function activeList() {
    return state.lists.find(l => l.id === state.active) || state.lists[0];
  }

  const RETENTION_HOURS = { "1h": 1, "6h": 6, "24h": 24 };

  // Removes completed tasks past their retention window. Completed tasks
  // stay in place (and viewable) otherwise — this only prunes old ones.
  function purgeExpiredCompleted() {
    const retention = state.settings.retention;
    if (retention === "never") return;

    const now = Date.now();
    let changed = false;

    state.lists.forEach(l => {
      const before = l.items.length;
      l.items = l.items.filter(it => {
        if (!it.done || !it.completedAt) return true;
        const completedAt = new Date(it.completedAt).getTime();
        if (retention === "endOfDay") {
          return new Date(completedAt).toDateString() === new Date(now).toDateString();
        }
        const hours = RETENTION_HOURS[retention] || 24;
        return now - completedAt < hours * 3600 * 1000;
      });
      if (l.items.length !== before) changed = true;
    });

    if (changed) save();
  }

  // Pushes a deleted task/note/list into state.trash instead of discarding
  // it outright. `payload` shape varies by kind — see design.md for
  // add-trash-recovery: { item, subtasks } for "task", { item } or
  // { taskId, text } for "note", { list } for "list".
  function trashItem(kind, payload, listId, listName) {
    state.trash.push({
      _id: uid(), kind, deletedAt: new Date().toISOString(), listId, listName, payload,
    });
  }

  const TRASH_RETENTION_DAYS = { "1d": 1, "3d": 3, "7d": 7, "30d": 30 };

  function purgeExpiredTrash() {
    const retention = state.settings.trashRetention;
    if (retention === "never") return;
    const days = TRASH_RETENTION_DAYS[retention] || 7;
    const now = Date.now();
    const before = state.trash.length;
    state.trash = state.trash.filter(entry => now - new Date(entry.deletedAt).getTime() < days * 86400 * 1000);
    if (state.trash.length !== before) save();
  }

  function buildTabEl(l) {
    const tab = document.createElement("div");
    tab.className = "tab" + (l.id === state.active ? " active" : "");
    tab.dataset.listId = l.id;
    if (l.color) tab.style.setProperty("--tab-color", l.color);

    const dot = document.createElement("span");
    dot.className = "tab-dot";

    const name = document.createElement("span");
    name.className = "tab-name-text";
    name.textContent = l.name;
    name.ondblclick = ev => { ev.stopPropagation(); renameTab(l, tab, name); };

    tab.onclick = () => { state.active = l.id; save(); renderTabs(); renderList(); };
    tab.oncontextmenu = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      showTabMenu(l, tab, ev.clientX, ev.clientY);
    };

    tab.draggable = true;
    tab.ondragstart = ev => {
      draggedListId = l.id;
      tab.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", l.id);
    };
    tab.ondragend = () => {
      tab.classList.remove("dragging");
      tabsEl.querySelectorAll(".drag-over-left, .drag-over-right, .drag-over-group")
        .forEach(el => el.classList.remove("drag-over-left", "drag-over-right", "drag-over-group"));
      draggedListId = null;
    };
    tab.ondragover = ev => {
      if (!draggedListId || draggedListId === l.id) return;
      ev.preventDefault();
      const rect = tab.getBoundingClientRect();
      const pct = (ev.clientX - rect.left) / rect.width;
      tab.classList.toggle("drag-over-left", pct < 0.33);
      tab.classList.toggle("drag-over-group", pct >= 0.33 && pct <= 0.67);
      tab.classList.toggle("drag-over-right", pct > 0.67);
    };
    tab.ondragleave = () => tab.classList.remove("drag-over-left", "drag-over-right", "drag-over-group");
    tab.ondrop = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      tab.classList.remove("drag-over-left", "drag-over-right", "drag-over-group");
      if (!draggedListId || draggedListId === l.id) return;
      const rect = tab.getBoundingClientRect();
      const pct = (ev.clientX - rect.left) / rect.width;
      if (pct >= 0.33 && pct <= 0.67) {
        groupTabs(draggedListId, l.id);
      } else {
        reorderList(draggedListId, l.id, pct < 0.33);
      }
    };

    tab.append(dot, name);

    if (state.lists.length > 1) {
      const x = document.createElement("span");
      x.className = "tab-x";
      x.textContent = "×";
      x.title = "Delete list";
      x.onclick = ev => {
        ev.stopPropagation();
        if (!confirm(`Delete the "${l.name}" list and all its tasks?`)) return;
        const islandId = l.islandId;
        trashItem("list", { list: l }, l.id, l.name);
        state.lists = state.lists.filter(x2 => x2.id !== l.id);
        if (state.active === l.id) state.active = state.lists[0].id;
        if (islandId) dissolveIslandIfSingleton(islandId);
        save(); renderTabs(); renderList();
      };
      tab.appendChild(x);
    }

    return tab;
  }

  function renameIsland(island, nameEl) {
    const inp = document.createElement("input");
    inp.className = "tab-name-input";
    inp.value = island.name;
    nameEl.replaceWith(inp);
    inp.focus();
    inp.select();
    const commit = () => {
      const v = inp.value.trim();
      island.name = v || island.name;
      save(); renderTabs(); renderList();
    };
    inp.onblur = commit;
    inp.onkeydown = e => {
      if (e.key === "Enter") inp.blur();
      if (e.key === "Escape") { inp.onblur = null; renderTabs(); }
    };
    inp.onclick = ev => ev.stopPropagation();
  }

  // Members of an expanded island, wrapped in a labeled bracket with a
  // collapse chevron. Drops that land in the label/body gaps (not on a
  // member tab) are swallowed here rather than falling through to
  // tabsEl's own drop handler, which would otherwise misread them as
  // "drag out to open space" and ungroup the dragged tab.
  function buildIslandWrapper(island, members) {
    const wrap = document.createElement("div");
    wrap.className = "island";
    wrap.dataset.islandId = island.id;
    if (island.color) wrap.style.setProperty("--island-color", island.color);
    wrap.ondragover = ev => { if (draggedListId) ev.preventDefault(); };
    wrap.ondrop = ev => { ev.preventDefault(); ev.stopPropagation(); };

    const label = document.createElement("div");
    label.className = "island-label";

    const chevron = document.createElement("span");
    chevron.className = "island-chevron";
    chevron.textContent = "▾";
    label.appendChild(chevron);

    const name = document.createElement("span");
    name.className = "island-name";
    name.textContent = island.name;
    name.ondblclick = ev => { ev.stopPropagation(); renameIsland(island, name); };
    label.appendChild(name);

    label.onclick = () => { island.collapsed = true; save(); renderTabs(); renderList(); };
    label.oncontextmenu = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      showIslandMenu(island, ev.clientX, ev.clientY);
    };

    wrap.appendChild(label);

    const body = document.createElement("div");
    body.className = "island-body";
    members.forEach(m => body.appendChild(buildTabEl(m)));
    wrap.appendChild(body);

    return wrap;
  }

  // A collapsed island renders as a single pill; dropping a dragged tab
  // onto it joins that tab into the island (appended after its last member).
  function buildIslandPill(island, members) {
    const pill = document.createElement("div");
    pill.className = "tab island-pill" + (members.some(m => m.id === state.active) ? " active-member" : "");
    pill.dataset.islandId = island.id;
    if (island.color) pill.style.setProperty("--island-color", island.color);

    const chevron = document.createElement("span");
    chevron.className = "island-chevron";
    chevron.textContent = "▸";
    pill.appendChild(chevron);

    const name = document.createElement("span");
    name.className = "island-name";
    name.textContent = `${island.name} (${members.length})`;
    name.ondblclick = ev => { ev.stopPropagation(); renameIsland(island, name); };
    pill.appendChild(name);

    pill.onclick = () => { island.collapsed = false; save(); renderTabs(); renderList(); };
    pill.oncontextmenu = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      showIslandMenu(island, ev.clientX, ev.clientY);
    };

    pill.ondragover = ev => {
      if (!draggedListId) return;
      const dragged = state.lists.find(x => x.id === draggedListId);
      if (dragged && dragged.islandId === island.id) return;
      ev.preventDefault();
      pill.classList.add("drag-over-group");
    };
    pill.ondragleave = () => pill.classList.remove("drag-over-group");
    pill.ondrop = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      pill.classList.remove("drag-over-group");
      if (!draggedListId) return;
      const dragged = state.lists.find(x => x.id === draggedListId);
      if (!dragged || dragged.islandId === island.id) return;
      const prevIslandId = dragged.islandId;
      dragged.islandId = island.id;
      spliceListTo(draggedListId, members[members.length - 1].id, false);
      if (prevIslandId) dissolveIslandIfSingleton(prevIslandId);
      save(); renderTabs(); renderList();
    };

    return pill;
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    const rendered = new Set();

    state.lists.forEach(l => {
      if (rendered.has(l.id)) return;

      if (!l.islandId) {
        tabsEl.appendChild(buildTabEl(l));
        rendered.add(l.id);
        return;
      }

      const members = state.lists.filter(x => x.islandId === l.islandId);
      members.forEach(m => rendered.add(m.id));

      const island = state.islands.find(x => x.id === l.islandId);
      if (!island) {
        // Orphaned islandId with no matching island record - render as
        // plain standalone tabs rather than losing them from the strip.
        members.forEach(m => tabsEl.appendChild(buildTabEl(m)));
        return;
      }

      tabsEl.appendChild(island.collapsed ? buildIslandPill(island, members) : buildIslandWrapper(island, members));
    });

    const addBtn = document.createElement("button");
    addBtn.className = "tab-add";
    addBtn.textContent = "+";
    addBtn.title = "New list";
    addBtn.onclick = () => {
      const l = { id: uid(), name: "New list", items: [], color: null, syncToVault: true, islandId: null };
      state.lists.push(l);
      state.active = l.id;
      save(); renderTabs(); renderList();
      requestAnimationFrame(() => {
        const lastTab = tabsEl.querySelector(`.tab[data-list-id="${l.id}"]`);
        const nameEl = lastTab && lastTab.querySelector(".tab-name-text");
        if (lastTab && nameEl) renameTab(l, lastTab, nameEl, true);
      });
    };
    tabsEl.appendChild(addBtn);
  }

  // Dropping a dragged tab in open tab-strip space (not onto another tab
  // or into an island's own drop handlers, which stopPropagation before
  // this ever runs) clears its island membership.
  tabsEl.ondragover = ev => { if (draggedListId) ev.preventDefault(); };
  tabsEl.ondrop = ev => {
    ev.preventDefault();
    if (!draggedListId) return;
    const l = state.lists.find(x => x.id === draggedListId);
    if (l && l.islandId) {
      const prevIslandId = l.islandId;
      l.islandId = null;
      dissolveIslandIfSingleton(prevIslandId);
      save(); renderTabs(); renderList();

  };

  function sanitizeFilename(name) {
    const cleaned = (name || "").trim().replace(/[^a-zA-Z0-9 _-]/g, "").trim().replace(/\s+/g, "-");
    return cleaned || "list";
  }

  function exportListAsText(l) {
    const text = l.items.map(it => it.text).join("\n") + "\n";
    const filename = sanitizeFilename(l.name);
    if (window.pywebview && window.pywebview.api && window.pywebview.api.export_list_text) {
      window.pywebview.api.export_list_text(text, filename).catch(() => {});
      return;
    }
    // Browser fallback — used when running outside the packaged app (e.g. dev/testing).
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${filename}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Splits a single outline line into its indent width (leading whitespace,
  // tabs counted as 1 column) and its text, stripping a leading "-"/"*"/"•"
  // bullet marker if present. Bullets aren't required — a plain indented
  // line with no marker still parses fine.
  function parseOutlineLine(rawLine) {
    const leading = rawLine.match(/^[ \t]*/)[0];
    const indent = leading.length;
    const rest = rawLine.slice(indent).replace(/^[-*•]\s*/, "").trim();
    return { indent, text: rest };
  }

  // Pasting a multi-line outline into the add-task box turns each top-level
  // line into its own task; anything indented under it (any depth) is
  // folded into that task's attached note, reusing the note feature rather
  // than inventing real subtask nesting. This keeps a big pasted breakdown
  // from turning into dozens of flat, context-free tasks.
  function importOutlineText(rawText) {
    const parsed = rawText.split(/\r?\n/).map(parseOutlineLine).filter(p => p.text);
    if (!parsed.length) return;

    const topIndent = parsed[0].indent;
    const newItems = [];
    let current = null;
    let indentStack = [];

    const finalizeCurrent = () => {
      if (current && current.noteLines.length) current.item.note = current.noteLines.join("\n");
    };

    const startTask = text => {
      finalizeCurrent();
      const item = {
        _id: uid(), type: "task", text, done: false, due: null, dueAllDay: false, notified: false,
        pinned: false, repeat: null, repeatDays: null, repeatWeekday: null,
        repeatOccurrence: null, completedAt: null, note: null,
      };
      newItems.push(item);
      current = { item, noteLines: [] };
      indentStack = [];
    };

    parsed.forEach(p => {
      if (!current || p.indent <= topIndent) {
        startTask(p.text);
        return;
      }
      // Pop any levels at least as deep as this line, so re-dedenting back
      // to a previously-seen depth reuses that depth instead of stacking
      // forever — this is what keeps sibling bullets at the same indent.
      while (indentStack.length && indentStack[indentStack.length - 1] >= p.indent) indentStack.pop();
      indentStack.push(p.indent);
      const depth = indentStack.length;
      current.noteLines.push("  ".repeat(depth - 1) + "- " + p.text);
    });
    finalizeCurrent();

    activeList().items.push(...newItems);
    save(); renderTabs(); renderList();
  }

  function addLinesToList(l, text) {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    lines.forEach(line => {
      l.items.push({
        _id: uid(), text: line, done: false, due: null, dueAllDay: false, notified: false,
        pinned: false, repeat: null, repeatDays: null, repeatWeekday: null,
        repeatOccurrence: null, completedAt: null,
      });
    });
    save(); renderTabs(); renderList();
  }

  function importTextIntoList(l) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.import_list_text) {
      window.pywebview.api.import_list_text().then(text => {
        if (text) addLinesToList(l, text);
      }).catch(() => {});
      return;
    }
    // Browser fallback — used when running outside the packaged app (e.g. dev/testing).
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".txt,text/plain";
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => addLinesToList(l, String(reader.result));
      reader.readAsText(file);
    };
    input.click();
  }

  function toDateInputValue(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function toTimeInputValue(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Native <input type="time"> follows the system's regional format —
  // on a 24-hour locale it never shows AM/PM at all. Use explicit
  // hour/minute/AM-PM controls instead so it's consistent everywhere.
  function to12Hour(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    let hour = h % 12;
    if (hour === 0) hour = 12;
    return { hour, minute: m, ampm };
  }

  function to24HourValue(hour12, minute, ampm) {
    let h = Number(hour12) % 12;
    if (ampm === "PM") h += 12;
    return `${String(h).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
  }

  function formatDue(iso, allDay) {
    const d = new Date(iso);
    if (allDay) {
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }
    const sameDay = d.toDateString() === new Date().toDateString();
    const opts = sameDay
      ? { hour: "numeric", minute: "2-digit" }
      : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
    return d.toLocaleString(undefined, opts);
  }

  // All-day tasks are "due" for their whole calendar day — they only
  // become overdue once that day has fully passed, not the instant its
  // midnight timestamp is reached.
  function isOverdue(item) {
    const d = new Date(item.due);
    if (item.dueAllDay) d.setHours(24, 0, 0, 0);
    return d.getTime() <= Date.now();
  }

  const WEEKDAY_ABBR = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const OCCURRENCE_LABEL = { 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", "-1": "Last" };

  function parseRepeatDays(s) {
    return s ? s.split(",").map(Number) : [];
  }

  // Which occurrence (1-4, or -1 for "last") the given date's weekday is
  // within its own month — used to default the monthly picker.
  function occurrenceInMonth(date) {
    const next = new Date(date);
    next.setDate(next.getDate() + 7);
    if (next.getMonth() !== date.getMonth()) return -1;
    return Math.floor((date.getDate() - 1) / 7) + 1;
  }

  function repeatLabel(item) {
    const r = item.repeat;
    if (r === "daily") return "Daily";
    if (r === "weekly") {
      const days = parseRepeatDays(item.repeatDays);
      return days.length ? `Weekly (${days.map(d => WEEKDAY_ABBR[d]).join(", ")})` : "Weekly";
    }
    if (r === "monthly") {
      if (item.repeatWeekday != null && item.repeatOccurrence != null) {
        return `Monthly (${OCCURRENCE_LABEL[item.repeatOccurrence]} ${WEEKDAY_ABBR[item.repeatWeekday]})`;
      }
      return "Monthly";
    }
    return "";
  }

  // Nth (or, for occurrence -1, last) weekday of the given month, preserving
  // baseDate's time-of-day. `month` may be 0-11 for the target month.
  function nthWeekdayOfMonth(baseDate, year, month, weekday, occurrence) {
    const h = baseDate.getHours(), m = baseDate.getMinutes(), s = baseDate.getSeconds();
    if (occurrence === -1) {
      const last = new Date(year, month + 1, 0, h, m, s);
      const diff = (last.getDay() - weekday + 7) % 7;
      last.setDate(last.getDate() - diff);
      return last;
    }
    const first = new Date(year, month, 1, h, m, s);
    const diff = (weekday - first.getDay() + 7) % 7;
    const day = 1 + diff + (occurrence - 1) * 7;
    return new Date(year, month, day, h, m, s);
  }

  function nextOccurrence(iso, item) {
    const d = new Date(iso);
    const repeat = item.repeat;
    if (repeat === "daily") {
      d.setDate(d.getDate() + 1);
    } else if (repeat === "weekly") {
      const days = parseRepeatDays(item.repeatDays);
      if (days.length) {
        do { d.setDate(d.getDate() + 1); } while (!days.includes(d.getDay()));
      } else {
        d.setDate(d.getDate() + 7);
      }
    } else if (repeat === "monthly") {
      if (item.repeatWeekday != null && item.repeatOccurrence != null) {
        let year = d.getFullYear(), month = d.getMonth() + 1;
        if (month > 11) { month = 0; year++; }
        return nthWeekdayOfMonth(d, year, month, item.repeatWeekday, item.repeatOccurrence).toISOString();
      }
      d.setMonth(d.getMonth() + 1);
    }
    return d.toISOString();
  }

  function renderList() {
    if (viewMode === "completed") renderCompletedList();
    else if (viewMode === "settings") renderSettingsView();
    else if (viewMode === "calendar") renderCalendarView();
    else if (viewMode === "trash") renderTrashView();
    else renderActiveList();
  }

  function renderActiveList() {
    const al = activeList();
    const items = al.items;
    list.innerHTML = "";

    // Completed items stay in the data (for counts / the completed view)
    // but are never rendered here again once done — they "leave" via the
    // animation in box.onclick, right before this function runs.
    const notDoneIdx = items.map((_, i) => i).filter(i => !items[i].done);
    const notDoneById = new Map(notDoneIdx.map(i => [items[i]._id, i]));
    const pinFirst = (a, b) => (items[b].pinned ? 1 : 0) - (items[a].pinned ? 1 : 0);

    // A subtask renders indented under its parent only if that parent is
    // itself currently visible (not done/deleted) — otherwise it's an
    // orphan for rendering purposes and surfaces as top-level instead of
    // silently disappearing.
    const isVisibleSubtask = i => items[i].parentId && notDoneById.has(items[i].parentId);

    const order = [];
    notDoneIdx.filter(i => !isVisibleSubtask(i)).sort(pinFirst).forEach(i => {
      order.push(i);
      if (items[i].subtasksCollapsed) return;
      notDoneIdx.filter(j => items[j].parentId === items[i]._id).sort(pinFirst).forEach(j => order.push(j));
    });

    if (!order.length) {
      list.innerHTML = '<div class="empty">Nothing here yet — add your first task above.</div>';
    }

    order.forEach(i => {
      const it = items[i];
      const isNote = it.type === "note";
      const isSubtask = isVisibleSubtask(i);
      const hasSubtasks = !isNote && notDoneIdx.some(j => items[j].parentId === it._id);
      const li = document.createElement("li");
      li.className = (it.pinned ? "pinned-row " : "") + (isNote ? "note-row " : "") + (isSubtask ? "subtask-row " : "");
      if (it._id && it._id === pendingEnterId) li.classList.add("entering");

      li.draggable = true;
      li.ondragstart = ev => {
        draggedItemId = it._id;
        li.classList.add("dragging");
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", it._id);
      };
      li.ondragend = () => {
        li.classList.remove("dragging");
        list.querySelectorAll(".drag-over-top, .drag-over-bottom, .drag-over-route")
          .forEach(el => el.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-route"));
        draggedItemId = null;
      };
      li.ondragover = ev => {
        if (!draggedItemId || draggedItemId === it._id) return;
        ev.preventDefault();
        const rect = li.getBoundingClientRect();
        const pct = (ev.clientY - rect.top) / rect.height;
        const draggedItem = items.find(x => x._id === draggedItemId);
        // A dragged note over a task routes (center band); a dragged task
        // over another task nests it (center band). Either way, dropping
        // near an edge is always a plain reorder instead.
        const canRouteNote = !isNote && draggedItem && draggedItem.type === "note";
        const canNestTask = !isNote && draggedItem && draggedItem.type === "task";
        if (canRouteNote || canNestTask) {
          li.classList.toggle("drag-over-top", pct < 0.25);
          li.classList.toggle("drag-over-route", pct >= 0.25 && pct <= 0.75);
          li.classList.toggle("drag-over-bottom", pct > 0.75);
        } else {
          li.classList.toggle("drag-over-top", pct < 0.5);
          li.classList.toggle("drag-over-bottom", pct >= 0.5);
          li.classList.remove("drag-over-route");
        }
      };
      li.ondragleave = () => li.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-route");
      li.ondrop = ev => {
        ev.preventDefault();
        ev.stopPropagation();
        li.classList.remove("drag-over-top", "drag-over-bottom", "drag-over-route");
        if (!draggedItemId || draggedItemId === it._id) return;
        const rect = li.getBoundingClientRect();
        const pct = (ev.clientY - rect.top) / rect.height;
        const draggedItem = items.find(x => x._id === draggedItemId);
        const inCenterBand = pct >= 0.25 && pct <= 0.75;
        if (!isNote && draggedItem && draggedItem.type === "note" && inCenterBand) {
          routeNoteOntoTask(draggedItemId, it._id);
          return;
        }
        if (!isNote && draggedItem && draggedItem.type === "task" && inCenterBand) {
          nestTaskUnderTask(draggedItemId, it._id);
          return;
        }
        reorderItem(draggedItemId, it._id, pct < 0.5);
      };

      const dragHandle = document.createElement("div");
      dragHandle.className = "drag-handle";
      dragHandle.textContent = "⠿";
      dragHandle.title = "Drag to reorder";

      const txtWrap = document.createElement("div");
      txtWrap.className = "txt-wrap";

      let chevron = null;
      if (hasSubtasks) {
        chevron = document.createElement("button");
        chevron.className = "subtask-chevron";
        chevron.textContent = it.subtasksCollapsed ? "▸" : "▾";
        chevron.title = it.subtasksCollapsed ? "Show subtasks" : "Hide subtasks";
        chevron.onclick = ev => {
          ev.stopPropagation();
          items[i].subtasksCollapsed = !items[i].subtasksCollapsed;
          save(); renderList();
        };
      }

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = it.text;
      txt.title = "Double-click to edit";
      txt.ondblclick = () => edit(i, txt);
      txtWrap.appendChild(txt);

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete";
      del.onclick = () => {
        if (it.type === "note") {
          trashItem("note", { item: it }, al.id, al.name);
          al.items = items.filter(x => x._id !== it._id);
          save(); renderList();
          return;
        }
        const childIdx = items.map((_, idx) => idx).filter(idx => items[idx].parentId === it._id);
        if (childIdx.length) {
          const n = childIdx.length;
          if (!confirm(`Delete "${it.text}" and its ${n} subtask${n > 1 ? "s" : ""}?`)) return;
        }
        const subtasks = childIdx.map(idx => items[idx]);
        const idsToRemove = new Set([it._id, ...subtasks.map(x => x._id)]);
        trashItem("task", { item: it, subtasks }, al.id, al.name);
        al.items = items.filter(x => !idsToRemove.has(x._id));
        save(); renderList();
      };

      if (isNote) {
        actions.append(del);
        li.append(dragHandle, txtWrap, actions);
        list.appendChild(li);
        return;
      }

      const box = document.createElement("div");
      box.className = "box";
      box.onclick = () => {
        playCheckSound();
        li.classList.add("leaving");
        li.addEventListener("animationend", () => {
          items[i].done = true;
          items[i].completedAt = new Date().toISOString();
          if (items[i].repeat && items[i].due) {
            items[i].due = nextOccurrence(items[i].due, items[i]);
            items[i].done = false;
            items[i].completedAt = null;
            items[i].notified = false;
            pendingEnterId = items[i]._id;
          }
          save(); renderList();
        }, { once: true });
      };

      if (it.due) {
        const overdue = isOverdue(it);
        const due = document.createElement("div");
        due.className = "due" + (overdue ? " overdue" : "");
        due.textContent = (overdue ? "Overdue • " : "") + formatDue(it.due, it.dueAllDay) +
          (it.repeat ? " · ↻ " + repeatLabel(it) : "");
        due.title = "Click to change due date/time";
        due.onclick = () => toggleDueEdit(i, txtWrap);
        txtWrap.appendChild(due);
      }

      let noteIndicator = null;
      if (it.note) {
        let expanded = false;
        noteIndicator = document.createElement("button");
        noteIndicator.className = "note-indicator";

        const attachedWrap = document.createElement("div");
        txtWrap.appendChild(attachedWrap);

        const updateIndicator = () => {
          noteIndicator.textContent = expanded ? "▲" : "▾";
          noteIndicator.title = expanded ? "Hide attached note" : "Show attached note";
          noteIndicator.classList.toggle("expanded", expanded);
        };

        const renderAttachedNote = () => {
          updateIndicator();
          attachedWrap.innerHTML = "";
          if (!expanded) return;

          const attached = document.createElement("div");
          attached.className = "note-attached";

          const text = document.createElement("div");
          text.className = "note-attached-text";
          it.note.split("\n").forEach(lineText => {
            const lineEl = document.createElement("div");
            lineEl.className = "note-attached-line";
            lineEl.textContent = lineText;
            text.appendChild(lineEl);
          });
          text.title = "Double-click to edit, or drag out to un-route";
          text.draggable = true;
          text.ondblclick = ev => { ev.stopPropagation(); editAttachedNote(); };
          text.ondragstart = ev => {
            ev.stopPropagation();
            draggedAttachedFromId = it._id;
            attached.classList.add("dragging");
            ev.dataTransfer.effectAllowed = "move";
            ev.dataTransfer.setData("text/plain", it._id);
          };
          text.ondragend = () => {
            attached.classList.remove("dragging");
            draggedAttachedFromId = null;
          };

          const actionsRow = document.createElement("div");
          actionsRow.className = "note-attached-actions";

          const detachBtn = document.createElement("button");
          detachBtn.className = "note-attached-btn";
          detachBtn.textContent = "⇤";
          detachBtn.title = "Detach into a standalone note";
          detachBtn.onclick = ev => {
            ev.stopPropagation();
            items.push({ _id: uid(), type: "note", text: it.note });
            it.note = null;
            save(); renderList();
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "note-attached-btn delete";
          deleteBtn.textContent = "×";
          deleteBtn.title = "Delete this note";
          deleteBtn.onclick = ev => {
            ev.stopPropagation();
            trashItem("note", { taskId: it._id, text: it.note }, al.id, al.name);
            it.note = null;
            save(); renderList();
          };

          actionsRow.append(detachBtn, deleteBtn);
          attached.append(text, actionsRow);
          attachedWrap.appendChild(attached);
        };

        const editAttachedNote = () => {
          const attached = attachedWrap.querySelector(".note-attached");
          const textEl = attached.querySelector(".note-attached-text");
          const textarea = document.createElement("textarea");
          textarea.className = "note-attached-edit";
          textarea.value = it.note;
          textEl.replaceWith(textarea);
          textarea.focus();
          textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          const commit = () => {
            const v = textarea.value.trim();
            it.note = v || it.note;
            save(); renderList();
          };
          textarea.onblur = commit;
          textarea.onkeydown = e => {
            if (e.key === "Escape") { textarea.onblur = null; renderList(); }
            if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) textarea.blur();
          };
          textarea.onclick = ev => ev.stopPropagation();
        };
        noteIndicator.onclick = ev => {
          ev.stopPropagation();
          expanded = !expanded;
          renderAttachedNote();
        };
        renderAttachedNote();
      }

      const pinBtn = document.createElement("button");
      pinBtn.className = "pin-btn" + (it.pinned ? " pinned" : "");
      pinBtn.textContent = "📌";
      pinBtn.title = it.pinned ? "Unpin" : "Pin to top";
      pinBtn.onclick = () => { items[i].pinned = !items[i].pinned; save(); renderList(); };

      const dueBtn = document.createElement("button");
      dueBtn.className = "due-btn";
      dueBtn.textContent = "🕐";
      dueBtn.title = it.due ? "Change due date/time" : "Add due date/time";
      dueBtn.onclick = () => toggleDueEdit(i, txtWrap);

      if (noteIndicator) actions.append(noteIndicator);
      actions.append(pinBtn, dueBtn, del);
      if (chevron) li.append(chevron);
      li.append(dragHandle, box, txtWrap, actions);
      list.appendChild(li);
    });
    pendingEnterId = null;

    const taskItems = items.filter(x => x.type !== "note");
    const done = taskItems.filter(x => x.done).length;
    const left = taskItems.length - done;
    document.getElementById("count").textContent = taskItems.length ? `${left} left` : "";
  }

  function renderCompletedList() {
    const al = activeList();
    const items = al.items;
    list.innerHTML = "";

    const order = items.map((_, i) => i)
      .filter(i => items[i].done)
      .sort((a, b) => new Date(b && items[b].completedAt || 0) - new Date(a && items[a].completedAt || 0));

    if (!order.length) {
      list.innerHTML = '<div class="empty">No completed tasks yet.</div>';
    }

    order.forEach(i => {
      const it = items[i];
      const li = document.createElement("li");
      li.className = "done";

      const box = document.createElement("div");
      box.className = "box";
      box.title = "Mark as not done";
      box.onclick = () => {
        items[i].done = false;
        items[i].completedAt = null;
        save(); renderList();
      };

      const txtWrap = document.createElement("div");
      txtWrap.className = "txt-wrap";

      const txt = document.createElement("div");
      txt.className = "txt";
      txt.textContent = it.text;
      txtWrap.appendChild(txt);

      if (it.completedAt) {
        const completed = document.createElement("div");
        completed.className = "completed-at";
        completed.textContent = "Completed " + formatDue(it.completedAt);
        txtWrap.appendChild(completed);
      }

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const restoreBtn = document.createElement("button");
      restoreBtn.className = "restore-btn";
      restoreBtn.textContent = "↩";
      restoreBtn.title = "Restore to active list";
      restoreBtn.onclick = () => {
        items[i].done = false;
        items[i].completedAt = null;
        save(); renderList();
      };

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete permanently";
      del.onclick = () => {
        const childIdx = items.map((_, idx) => idx).filter(idx => items[idx].parentId === it._id);
        if (childIdx.length) {
          const n = childIdx.length;
          if (!confirm(`Delete "${it.text}" and its ${n} subtask${n > 1 ? "s" : ""}?`)) return;
        }
        const subtasks = childIdx.map(idx => items[idx]);
        const idsToRemove = new Set([it._id, ...subtasks.map(x => x._id)]);
        trashItem("task", { item: it, subtasks }, al.id, al.name);
        al.items = items.filter(x => !idsToRemove.has(x._id));
        save(); renderList();
      };

      actions.append(restoreBtn, del);
      li.append(box, txtWrap, actions);
      list.appendChild(li);
    });

    document.getElementById("count").textContent = order.length ? `${order.length} completed` : "";
  }
